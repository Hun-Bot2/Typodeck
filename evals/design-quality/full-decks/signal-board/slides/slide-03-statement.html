<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Board — Statement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  .s { position: absolute; inset: 0; background: #F6F8FA; color: #0F172A;
    font-family: 'Inter', system-ui, sans-serif; padding: 40px 72px 0 72px;
    display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 20px;
    font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.14em; }
  .live { color: #16A34A; font-size: 16px; }
  .top .sp { flex: 1; }
  .top .dim { color: #475569; }
  .top .amb { color: #B45309; font-weight: 600; }
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .kick { display: flex; align-items: center; gap: 24px; margin: 0;
    font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; }
  .kick .bl { color: #2563EB; }
  .stmt { margin: 32px 0 0 0; font-weight: 800; font-size: 92px; line-height: 1.08;
    letter-spacing: -0.015em; max-width: 15em; max-height: 620px; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 16px; margin-top: 40px;
    font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.08em;
    color: #475569; text-transform: uppercase; }
  .bar .sw { color: #2563EB; font-size: 18px; }
  .foot { flex: 0 0 60px; display: flex; align-items: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 18px; letter-spacing: 0.12em;
    color: #475569; text-transform: uppercase; }
  .foot .r { margin-left: auto; color: #0F172A; font-weight: 600; }
</style>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #deck-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #deck-stage { width: 1920px; height: 1080px; flex: 0 0 auto; position: relative; overflow: hidden; transform-origin: center center; background: #F6F8FA; }
</style>
</head>
<body>
<div id="deck-viewport"><div id="deck-stage">
<div class="s">
<div class="top"><span class="live">●</span><span>TYPODECK RESEARCH</span><span class="dim">/</span><span class="amb">POSTMORTEM SERIES</span><span class="sp"></span><span class="dim">SAMPLE</span><span>N = 11</span></div>
<div class="mid">
<p class="kick"><span class="bl">Flagship finding</span></p>
<p class="stmt" data-sbfit="92">Rushing to ship moves failure downstream, where it costs more.</p>
<p class="bar"><span class="sw">■</span><span>Typodeck Research · November 2026</span></p>
</div>
<div class="foot"><span>Research brief · Vol. 11</span><span class="r">P. 03</span></div>
</div>
</div></div>
<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<script>
  function __sbFit() {
    document.querySelectorAll('[data-sbfit]').forEach(function (t) {
      var max = parseFloat(t.getAttribute('data-sbfit'));
      t.style.fontSize = max + 'px';
      var size = max, guard = 0;
      while (guard++ < 40 && size > 48 && t.scrollHeight > t.clientHeight + 2) {
        size -= 2; t.style.fontSize = size + 'px';
      }
    });
  }
  document.addEventListener('DOMContentLoaded', __sbFit);
  window.addEventListener('load', __sbFit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(__sbFit);
</script>
</body>
</html>
