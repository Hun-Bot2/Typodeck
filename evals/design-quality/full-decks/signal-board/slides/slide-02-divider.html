<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Board — Divider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  .s { position: absolute; inset: 0; background: #F6F8FA; color: #0F172A;
    font-family: 'Inter', system-ui, sans-serif; padding: 40px 72px 0 72px;
    display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 20px;
    font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.14em; }
  .live { color: #16A34A; font-size: 16px; }
  .top .sp { flex: 1; }
  .top .dim { color: #475569; }
  .top .amb { color: #B45309; font-weight: 600; }
  .kick { display: flex; align-items: center; gap: 24px; margin: 56px 0 0 0;
    font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; }
  .kick .bl { color: #2563EB; }
  .ttl { margin: 28px 0 0 0; font-weight: 800; font-size: 104px; line-height: 1.04;
    letter-spacing: -0.015em; max-width: 16em; }
  .orient { margin: 30px 0 0 0; font-size: 34px; line-height: 1.45; color: #475569; max-width: 24em; }
  .cells { margin-top: auto; padding: 30px 0 34px 0; display: grid;
    grid-template-columns: 1fr 1fr 1fr; gap: 48px; font-family: 'IBM Plex Mono', monospace; }
  .cells .k { display: block; font-size: 16px; letter-spacing: 0.12em; color: #475569;
    margin-bottom: 10px; text-transform: uppercase; }
  .cells .v { display: block; font-size: 22px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; }
  .cells .v .wn { color: #B45309; }
  .foot { flex: 0 0 60px; display: flex; align-items: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 18px; letter-spacing: 0.12em;
    color: #475569; text-transform: uppercase; }
  .foot .r { margin-left: auto; color: #0F172A; font-weight: 600; }
</style>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #deck-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #deck-stage { width: 1920px; height: 1080px; flex: 0 0 auto; position: relative; overflow: hidden; transform-origin: center center; background: #F6F8FA; }
</style>
</head>
<body>
<div id="deck-viewport"><div id="deck-stage">
<div class="s">
<div class="top"><span class="live">●</span><span>TYPODECK RESEARCH</span><span class="dim">/</span><span class="amb">POSTMORTEM SERIES</span><span class="sp"></span><span class="dim">SAMPLE</span><span>N = 11</span></div>
<p class="kick"><span class="bl">Part I — Evidence</span><span>Section 01</span></p>
<h2 class="ttl">What the reviews actually caught</h2>
<p class="orient">Three patterns, one discipline.</p>
<div class="cells">
<div><span class="k">Section</span><span class="v">Part I — Evidence</span></div>
<div><span class="k">Scope</span><span class="v">Three patterns</span></div>
<div><span class="k">Status</span><span class="v"><span class="wn">▲</span> Under review</span></div>
</div>
<div class="foot"><span>Research brief · Vol. 11</span><span class="r">P. 02</span></div>
</div>
</div></div>
<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
</body>
</html>
