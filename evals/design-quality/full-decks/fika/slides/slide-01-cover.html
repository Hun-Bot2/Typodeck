<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fika — Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  .s { position: absolute; inset: 0; background: #FAFAF7; color: #31404B;
    font-family: 'Nunito Sans', system-ui, sans-serif; padding: 96px 120px 88px;
    display: flex; flex-direction: column; }
  .kick { display: flex; align-items: center; gap: 18px; font-size: 22px; font-weight: 700;
    letter-spacing: 0.15em; text-transform: uppercase; margin: 0; }
  .kick .d { color: #182B49; font-size: 20px; }
  .cols { flex: 1; display: flex; gap: 120px; align-items: center; min-height: 0; margin-top: 48px; }
  .txt { flex: 0 0 60%; min-width: 0; }
  .hero { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 88px;
    line-height: 1.12; text-transform: lowercase; margin: 0; max-height: 400px; overflow: hidden; }
  .sub { font-size: 32px; line-height: 1.6; margin: 48px 0 0 0; max-width: 30ch; }
  .keys { display: flex; flex-wrap: wrap; gap: 16px 40px; margin-top: 40px; }
  .keys span { font-size: 22px; font-weight: 700; color: #182B49; white-space: nowrap; }
  .keys span + span::before { content: "·  "; color: #31404B; font-weight: 400; }
  .num { flex: 1; min-width: 0; text-align: left; }
  .num .n { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 240px;
    line-height: 1; margin: 0; color: #31404B; }
  .num .c { font-size: 24px; line-height: 1.6; margin: 16px 0 0 0; }
  .foot { display: flex; align-items: baseline; justify-content: space-between; margin-top: 48px; }
  .page { font-size: 20px; font-weight: 700; letter-spacing: 0.2em; margin: 0; }
</style>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #deck-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #deck-stage { width: 1920px; height: 1080px; flex: 0 0 auto; position: relative; overflow: hidden; transform-origin: center center; background: #FAFAF7; }
</style>
</head>
<body>
<div id="deck-viewport"><div id="deck-stage">
    <div class="s">
      <p class="kick"><span class="d">●</span><span>Typodeck Research · November 2026</span></p>
      <div class="cols">
        <div class="txt">
          <h1 class="hero" data-autofit="88">The Hidden Cost of Rushing to Ship</h1>
          <p class="sub">What 11 postmortems taught us about review discipline</p>
          <p class="keys"><span>rushing to ship</span><span>11 postmortems</span><span>review discipline</span></p>
        </div>
        <div class="num">
          <p class="n">11</p>
          <p class="c">postmortems</p>
        </div>
      </div>
      <div class="foot"><p class="page">01</p></div>
    </div>
</div></div>
<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<script>
  function __fkAutofit() {
    document.querySelectorAll('[data-autofit]').forEach(function (el) {
      var max = parseFloat(el.getAttribute('data-autofit'));
      var size = max, min = Math.max(40, max * 0.5);
      el.style.fontSize = size + 'px';
      var guard = 60;
      while (guard-- > 0 && size > min && el.scrollHeight > el.clientHeight + 2) { size -= 2; el.style.fontSize = size + 'px'; }
    });
  }
  document.addEventListener('DOMContentLoaded', __fkAutofit);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(__fkAutofit); }
</script>
</body>
</html>
