<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peer Review — Divider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --paper: #FFFFFF; --ink: #1A1A1A; --blue: #0B5394; --rule: #EAEAEA; --abstract-tint: #F3F5F8; --muted: #5A6470; }
  * { box-sizing: border-box; }
  .pr-slide { position: absolute; inset: 0; background: var(--paper); color: var(--ink);
    font-family: "STIX Two Text", Georgia, "Times New Roman", serif; padding: 56px 88px 48px;
    display: flex; flex-direction: column; }
  .pr-runhead { display: flex; justify-content: space-between; align-items: baseline;
    font-family: Inter, system-ui, sans-serif; font-size: 20px; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink); }
  .pr-runhead .pr-page { color: var(--muted); letter-spacing: 0.14em; }
  .pr-double-rule { margin-top: 18px; border-top: 3px solid var(--ink); }
  .pr-double-rule::after { content: ""; display: block; border-top: 1px solid var(--ink); margin-top: 3px; }
  .pr-kicker { font-family: Inter, system-ui, sans-serif; font-size: 22px; font-weight: 700;
    letter-spacing: 0.24em; text-transform: uppercase; color: var(--blue); }
  .pr-abstract { background: var(--abstract-tint); border-left: 6px solid var(--blue); padding: 28px 34px 30px; }
  .pr-abstract-label { font-family: Inter, system-ui, sans-serif; font-size: 20px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink); margin-bottom: 14px; }
  .pr-abstract-text { margin: 0; font-style: italic; font-size: 35px; line-height: 1.42; color: var(--ink); }
  .pr-keywords { margin-top: 20px; padding-top: 16px; border-top: 1px solid #D8DEE5;
    font-family: Inter, system-ui, sans-serif; font-size: 21px; font-weight: 500; color: var(--muted); }
  .pr-keywords strong { font-weight: 700; color: var(--ink); }
  .pr-fig-label { font-family: Inter, system-ui, sans-serif; font-size: 20px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); }
  .pr-fig-title { font-family: Inter, system-ui, sans-serif; font-size: 24px; font-weight: 600; color: var(--ink); margin: 12px 0 20px; }
  .pr-caption { margin: 16px 0 0; font-family: Inter, system-ui, sans-serif; font-size: 21px; line-height: 1.5; color: var(--muted); }
  .pr-caption strong { color: var(--ink); font-weight: 700; }
  .pr-footnotes { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--ink);
    font-family: Inter, system-ui, sans-serif; font-size: 20px; line-height: 1.6; color: var(--muted);
    display: flex; gap: 48px; }
  .pr-footnotes .pr-fn sup { font-weight: 700; color: var(--blue); margin-right: 6px; }


  .pr-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; min-height: 0; max-width: 1380px; margin: 0 auto; width: 100%; }
  .pr-sect { margin: 26px 0 0 0; font-size: 84px; font-weight: 700; line-height: 1.1; letter-spacing: -0.005em; }
  .pr-center .pr-abstract { margin-top: 44px; text-align: left; width: 100%; }
  .pr-sec-rule { width: 100%; border-top: 1px solid var(--ink); margin-top: 44px; }
</style>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #deck-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #deck-stage { width: 1920px; height: 1080px; flex: 0 0 auto; position: relative; overflow: hidden; transform-origin: center center; background: #fff; }
</style>
</head>
<body>
<div id="deck-viewport"><div id="deck-stage">

    <div class="pr-slide">
      <div class="pr-runhead"><span>Typodeck Research · November 2026</span><span class="pr-page">p. 02</span></div>
      <div class="pr-double-rule"></div>
      <div class="pr-center">
        <div class="pr-kicker">Part I — Evidence</div>
        <h1 class="pr-sect">What the reviews actually caught</h1>
        <div class="pr-abstract">
          <div class="pr-abstract-label">Section</div>
          <p class="pr-abstract-text">Three patterns, one discipline.</p>
        </div>
        <div class="pr-sec-rule"></div>
      </div>
      <div class="pr-footnotes">
        <span class="pr-fn"><sup>[1]</sup>Scope: review discipline only.</span>
      </div>
    </div>
</div></div>
<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>

</body>
</html>
