<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peer Review — Statement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  .s { position: absolute; inset: 0; background: #FFFFFF; color: #1A1A1A;
    font-family: "STIX Two Text", Georgia, serif; padding: 56px 88px 48px;
    display: flex; flex-direction: column; }
  .run { display: flex; justify-content: space-between; align-items: baseline;
    font-family: Inter, system-ui, sans-serif; font-size: 20px; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase; }
  .run .pg { color: #5A6470; letter-spacing: 0.14em; }
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .stmt { margin: 0; font-size: 76px; font-weight: 700; line-height: 1.18;
    letter-spacing: -0.005em; max-width: 24ch; }
  .fns { margin-top: auto; padding-top: 24px; font-family: Inter, system-ui, sans-serif;
    font-size: 20px; line-height: 1.6; color: #5A6470; display: flex; gap: 48px; }
  .fns sup { font-weight: 700; color: #0B5394; margin-right: 6px; }
</style>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #deck-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #deck-stage { width: 1920px; height: 1080px; flex: 0 0 auto; position: relative; overflow: hidden; transform-origin: center center; background: #fff; }
</style>
</head>
<body>
<div id="deck-viewport"><div id="deck-stage">
    <div class="s">
      <div class="run"><span>Typodeck Research · November 2026</span><span class="pg">p. 03</span></div>
      <div class="mid">
        <p class="stmt">Rushing to ship moves failure downstream, where it costs more.</p>
      </div>
      <div class="fns"><span><sup>[1]</sup>Typodeck Research · November 2026.</span></div>
    </div>
</div></div>
<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
</body>
</html>
