<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gridline-swiss — full deck review</title>
<style>
  html, body { margin:0; padding:0; background:#111; color:#eee;
    font-family:system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:14px 24px;
    background:#0a0a0a; border-bottom:1px solid #333; position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .n { color:#888; font-size:13px; }
  nav { display:flex; gap:8px; margin-left:auto; flex-wrap:wrap; }
  nav button { background:#222; color:#eee; border:1px solid #444; border-radius:6px;
    padding:6px 12px; font-size:13px; cursor:pointer; }
  nav button[aria-current="true"] { background:#eee; color:#111; border-color:#eee; }
  main { padding:24px; display:flex; flex-direction:column; gap:48px; align-items:center; }
  section { width:min(1600px, 96vw); }
  section h2 { font-size:14px; font-weight:600; color:#aaa; margin:0 0 10px 0; }
  section h2 code { color:#eee; }
  .frame { width:100%; aspect-ratio:16/9; border:1px solid #333; background:#000; }
  .frame iframe { width:100%; height:100%; border:0; display:block; }
</style>
</head>
<body>
<header>
  <h1>gridline-swiss <span class="n">(D01) — 7-slide benchmark deck</span></h1>
  <nav><button data-i="0">01 cover</button><button data-i="1">02 divider</button><button data-i="2">03 statement</button><button data-i="3">04 evidence</button><button data-i="4">05 comparison</button><button data-i="5">06 dense</button><button data-i="6">07 closing</button></nav>
</header>
<main>
<section id="s01"><h2>01 — <code>slides/slide-01-cover.html</code></h2><div class="frame"><iframe loading="lazy" title="cover" src="slides/slide-01-cover.html"></iframe></div></section><section id="s02"><h2>02 — <code>slides/slide-02-divider.html</code></h2><div class="frame"><iframe loading="lazy" title="divider" src="slides/slide-02-divider.html"></iframe></div></section><section id="s03"><h2>03 — <code>slides/slide-03-statement.html</code></h2><div class="frame"><iframe loading="lazy" title="statement" src="slides/slide-03-statement.html"></iframe></div></section><section id="s04"><h2>04 — <code>slides/slide-04-evidence.html</code></h2><div class="frame"><iframe loading="lazy" title="evidence" src="slides/slide-04-evidence.html"></iframe></div></section><section id="s05"><h2>05 — <code>slides/slide-05-comparison.html</code></h2><div class="frame"><iframe loading="lazy" title="comparison" src="slides/slide-05-comparison.html"></iframe></div></section><section id="s06"><h2>06 — <code>slides/slide-06-dense.html</code></h2><div class="frame"><iframe loading="lazy" title="dense" src="slides/slide-06-dense.html"></iframe></div></section><section id="s07"><h2>07 — <code>slides/slide-07-closing.html</code></h2><div class="frame"><iframe loading="lazy" title="closing" src="slides/slide-07-closing.html"></iframe></div></section>
</main>
<script>
  var btns = Array.prototype.slice.call(document.querySelectorAll('nav button'));
  function go(i) {
    i = (i + btns.length) % btns.length;
    document.getElementById('s0' + (i + 1)).scrollIntoView({behavior:'smooth'});
    btns.forEach(function (b, j) { b.setAttribute('aria-current', j === i ? 'true' : 'false'); });
  }
  btns.forEach(function (b, i) { b.addEventListener('click', function () { go(i); }); });
  document.addEventListener('keydown', function (e) {
    var cur = btns.findIndex(function (b) { return b.getAttribute('aria-current') === 'true'; });
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ') go(cur + 1);
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') go(cur - 1);
    if (e.key === 'Home') go(0);
    if (e.key === 'End') go(btns.length - 1);
  });
  btns[0].setAttribute('aria-current', 'true');
</script>
</body>
</html>
