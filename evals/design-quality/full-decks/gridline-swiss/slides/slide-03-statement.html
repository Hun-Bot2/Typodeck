<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridline — Statement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  .s { position: absolute; inset: 0; background: #FFFFFF; color: #111111;
    font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
  .frame { position: absolute; inset: 0; padding: 64px 72px 0 72px;
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; align-content: start; }
  .kick { grid-column: 1 / 9; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 20px;
    letter-spacing: 0.18em; text-transform: uppercase; color: #E30613; margin: 0; }
  .kick .sq { font-size: 18px; }
  .stmt { grid-column: 1 / 10; font-family: 'Archivo', sans-serif; font-weight: 800;
    font-size: 92px; line-height: 1.06; letter-spacing: -0.01em; margin: 110px 0 0 0;
    max-height: 600px; overflow: hidden; }
  .src { grid-column: 1 / 8; font-size: 20px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; color: #6B6B6B; margin: 44px 0 0 0; }
  .rail { grid-column: 10 / 13; grid-row: 1 / 12; padding: 0 0 0 24px; align-self: start; margin-top: 200px; }
  .numeral { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 240px;
    line-height: 0.85; letter-spacing: -0.02em; margin: 0; }
  .meta { margin: 40px 0 0 0; padding: 0; list-style: none; }
  .meta li { font-size: 19px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
    line-height: 1.5; padding: 14px 0; }
  .meta li span { display: block; color: #6B6B6B; font-size: 16px; }
  .footer { position: absolute; left: 72px; right: 72px; bottom: 0; height: 110px;
    display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; }
  .footer .ctx { font-size: 20px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; margin: 0; }
  .footer .idx { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 22px;
    letter-spacing: 0.12em; margin: 0; }
</style>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #deck-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #deck-stage { width: 1920px; height: 1080px; flex: 0 0 auto; position: relative; overflow: hidden; transform-origin: center center; background: #fff; }
</style>
</head>
<body>
<div id="deck-viewport"><div id="deck-stage">
<div class="s"><div class="frame">
<p class="kick"><span class="sq">■</span> The finding</p>
<p class="stmt" data-autofit="92">Rushing to ship moves failure downstream, where it costs more.</p>
<p class="src">Typodeck Research · November 2026</p>
<aside class="rail"><p class="numeral">03</p>
<ul class="meta"><li><span>Form</span>Statement</li><li><span>Cases</span>11 postmortems</li><li><span>Issue</span>November 2026</li></ul></aside>
<div class="footer"><p class="ctx">Typodeck Research · November 2026</p><p class="idx">03 / 07</p></div>
</div></div>
</div></div>
<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<script>
  function __gsAutofit() {
    document.querySelectorAll('[data-autofit]').forEach(function (el) {
      var max = parseFloat(el.getAttribute('data-autofit'));
      var size = max, min = Math.max(40, max * 0.35);
      el.style.fontSize = size + 'px';
      var guard = 60;
      while (guard-- > 0 && size > min && el.scrollHeight > el.clientHeight + 2) { size -= 4; el.style.fontSize = size + 'px'; }
    });
  }
  document.addEventListener('DOMContentLoaded', __gsAutofit);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(__gsAutofit); }
</script>
</body>
</html>
