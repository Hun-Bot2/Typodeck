<style>
  .gs { position:absolute; inset:0; background:#FFFFFF; color:#111111;
    font-family:'Inter', system-ui, sans-serif; overflow:hidden; }
  .gs .colgrid { position:absolute; top:0; bottom:0; left:72px; right:72px;
    display:grid; grid-template-columns:repeat(12, 1fr); gap:24px; pointer-events:none; }
  .gs .colgrid i { border-left:1px solid rgba(17,17,17,0.07); display:block; }
  .gs .colgrid i:last-child { border-right:1px solid rgba(17,17,17,0.07); }
  .gs .frame { position:absolute; inset:0; padding:64px 72px 0 72px;
    display:grid; grid-template-columns:repeat(12, 1fr); gap:24px; align-content:start; }
  .gs .kicker { grid-column:1 / 9; display:flex; align-items:center; gap:16px;
    font-family:'Archivo', "Arial Black", sans-serif; font-weight:600; font-size:20px;
    letter-spacing:0.18em; text-transform:uppercase; color:#E30613; margin:0; }
  .gs .kicker::before { content:""; width:18px; height:18px; background:#E30613; flex:0 0 auto; }
  .gs .redrule { grid-column:1 / 9; height:6px; background:#E30613; margin-top:20px; }
  .gs .rail { grid-column:9 / 13; grid-row:1 / 12; background:#F2F2F2; padding:40px 36px;
    overflow:hidden; display:flex; flex-direction:column; align-self:stretch; min-height:700px; }
  .gs .rail.narrow { grid-column:10 / 13; }
  .gs .numeral { font-family:'Archivo', "Arial Black", sans-serif; font-weight:800;

  .gs .railrule { height:6px; background:#E30613; margin:28px 0 28px 0; }
  .gs .meta { margin:0; padding:0; list-style:none; }
  .gs .meta li { font-size:19px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase;
    line-height:1.5; color:#111111; padding:14px 0; border-top:1px solid #D9D9D9; }
  .gs .meta li span { display:block; color:#6B6B6B; font-size:16px; }
  .gs .footer { position:absolute; left:72px; right:72px; bottom:0; height:110px;

  .gs .statement { grid-column:1 / 9; font-family:'Archivo', "Arial Black", sans-serif;

  .gs .srcline { grid-column:1 / 8; font-size:20px; font-weight:500; letter-spacing:0.08em;

  .gs .ev-msg { grid-column:1 / 9; font-family:'Archivo', "Arial Black", sans-serif;

  .gs .statrow { grid-column:1 / 9; display:flex; align-items:flex-end; gap:36px; margin:44px 0 0 0;
    border-top:2px solid #111111; padding-top:32px; }
  .gs .statnum { font-family:'Archivo', "Arial Black", sans-serif; font-weight:800;
    font-size:150px; line-height:0.9; letter-spacing:-0.02em; color:#111111; }
  .gs .statlab { font-size:20px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase;

  .gs .ev-sup { grid-column:1 / 8; font-size:24px; line-height:1.5; color:#333333; margin:32px 0 0 0; }
  .gs .cmp-title { grid-column:1 / 9; font-family:'Archivo', "Arial Black", sans-serif;

  .gs .zone-a { grid-column:1 / 5; margin-top:36px; }
  .gs .zone-b { grid-column:5 / 9; margin-top:36px; border-left:1px solid #D9D9D9; padding-left:24px; }
  .gs .zone-h { font-family:'Archivo', "Arial Black", sans-serif; font-weight:800; font-size:30px;

  .gs .zone ul { list-style:none; margin:0; padding:18px 0 0 0; border-top:2px solid #111111; }
  .gs .zone li { display:flex; gap:14px; align-items:flex-start; font-size:22px; line-height:1.45;
    color:#111111; padding:12px 0; border-bottom:1px solid #E4E4E4; }
  .gs .zone li::before { content:""; width:14px; height:14px; flex:0 0 auto; margin-top:9px; }
  .gs .zone-a li::before { background:#E30613; }
  .gs .zone-b li::before { background:#111111; }
  .gs .caption { grid-column:1 / 9; font-size:22px; line-height:1.5; color:#6B6B6B; margin:30px 0 0 0;
    border-top:1px solid #D9D9D9; padding-top:20px; }
  .gs .d-title { grid-column:1 / 10; font-family:'Archivo', "Arial Black", sans-serif;
    font-weight:800; font-size:48px; line-height:1.08; letter-spacing:-0.01em; margin:32px 0 0 0; }
  .gs .d-kicker { grid-column:1 / 10; }
  .gs .d-rule { grid-column:1 / 10; }
  .gs table.swiss { grid-column:1 / 10; border-collapse:collapse; margin:24px 0 0 0; width:100%; }
  .gs table.swiss th { font-size:18px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase;
    color:#6B6B6B; text-align:left; padding:10px 16px 10px 0; border-top:2px solid #111111;
    border-bottom:2px solid #111111; }
  .gs table.swiss td { font-size:21px; line-height:1.3; color:#111111; padding:8px 16px 8px 0;
    border-bottom:1px solid #E4E4E4; white-space:nowrap; }
  .gs table.swiss td.case { font-family:'Archivo', "Arial Black", sans-serif; font-weight:800; font-size:20px; }
  .gs table.swiss tr.flag td.cost::before { content:""; display:inline-block; width:12px; height:12px;
    background:#E30613; margin-right:10px; }
  .gs .d-foot { grid-column:1 / 10; font-size:18px; font-weight:500; letter-spacing:0.08em;
    text-transform:uppercase; color:#6B6B6B; margin:14px 0 0 0; }
  .gs .close-line { grid-column:1 / 9; font-family:'Archivo', "Arial Black", sans-serif;
    font-weight:800; font-size:118px; line-height:1.02; letter-spacing:-0.01em; margin:120px 0 0 0; }
  .gs .close-recap { grid-column:1 / 8; font-size:34px; line-height:1.45; color:#333333; margin:40px 0 0 0; }

<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }

<aside class="rail"><div class="numeral">01</div><div class="railrule"></div><ul class="meta"><li><span>Cases</span>11 postmortems</li><li><span>Subject</span>Review discipline</li><li><span>Issue</span>November 2026</li></ul></aside>

<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<script>
  function __gridlineAutofit() {
    document.querySelectorAll('[data-autofit]').forEach(function (el) {
      var max = parseFloat(el.getAttribute('data-autofit'));
      var size = max, min = Math.max(40, max * 0.35);
      el.style.fontSize = size + 'px';
      var guard = 60;
      while (guard-- > 0 && size > min && el.scrollHeight > el.clientHeight + 2) {
        size -= 4; el.style.fontSize = size + 'px';
      }
    });
  }
  document.addEventListener('DOMContentLoaded', __gridlineAutofit);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(__gridlineAutofit); }
</script>
</body>
</html>
