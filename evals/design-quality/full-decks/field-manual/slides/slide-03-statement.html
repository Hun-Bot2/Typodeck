<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Manual — Statement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  .s { position: absolute; inset: 0; background: #FFB000; color: #1A1A1A;
    font-family: 'IBM Plex Sans', system-ui, sans-serif; padding: 48px 88px 40px;
    display: flex; flex-direction: column; }
  .doc { display: flex; justify-content: space-between; align-items: baseline;
    font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase; margin: 0; }
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .warn { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase; margin: 0; }
  .stmt { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 88px;
    line-height: 1.08; text-transform: uppercase; margin: 32px 0 0 0; max-width: 20ch; }
  .src { margin: 40px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500; }
  .mark { margin: 24px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 19px; }
  .foot { display: flex; justify-content: space-between; margin-top: auto; padding-top: 24px;
    font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase; }
  .foot p { margin: 0; }
</style>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #deck-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #deck-stage { width: 1920px; height: 1080px; flex: 0 0 auto; position: relative; overflow: hidden; transform-origin: center center; background: #FFB000; }
</style>
</head>
<body>
<div id="deck-viewport"><div id="deck-stage">
    <div class="s">
      <p class="doc"><span>DOC FM-11 · REV C</span><span>Pre-Ship Review Procedure</span><span>NOV 2026</span></p>
      <div class="mid">
        <p class="warn">⚠ Rushing to ship</p>
        <p class="stmt">Rushing to ship moves failure downstream, where it costs more.</p>
        <p class="src">SOURCE ▸ Typodeck Research · November 2026</p>
        <p class="mark">§0</p>
      </div>
      <div class="foot"><p>FM-11 · Caution page</p><p>Page 03 / 07</p></div>
    </div>
</div></div>
<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
</body>
</html>
