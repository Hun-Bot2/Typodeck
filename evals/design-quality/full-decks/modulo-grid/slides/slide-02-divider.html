<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modulo — Divider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  .s { position: absolute; inset: 0; background: #14213D; color: #FFFFFF;
    font-family: 'Inter', system-ui, sans-serif; padding: 64px 120px 0 120px;
    display: flex; flex-direction: column; }
  .kick { display: flex; align-items: center; gap: 12px; margin: 0;
    font-family: 'Sora', sans-serif; font-weight: 600; font-size: 15px;
    letter-spacing: 0.12em; text-transform: uppercase; }
  .kick .b { color: #FCA311; font-size: 14px; }
  .main { flex: 1; display: flex; gap: 96px; align-items: center; min-height: 0; }
  .left { flex: 1 1 auto; min-width: 0; }
  .sec { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 15px;
    letter-spacing: 0.12em; text-transform: uppercase; color: #FCA311; margin: 0; }
  .ttl { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 92px;
    line-height: 1.06; letter-spacing: -0.015em; margin: 28px 0 0 0; max-width: 14ch; }
  .orient { font-size: 27px; line-height: 1.55; color: rgba(255,255,255,0.82); margin: 36px 0 0 0; }
  .num { flex: 0 0 auto; font-family: 'Sora', sans-serif; font-weight: 800; font-size: 220px;
    line-height: 1; letter-spacing: -0.02em; color: #FCA311; margin: 0; }
  .foot { flex: 0 0 120px; display: flex; align-items: center; justify-content: space-between;
    font-family: 'Sora', sans-serif; font-weight: 600; font-size: 14px;
    letter-spacing: 0.12em; text-transform: uppercase; }
  .foot .ct { color: #FCA311; }
</style>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #deck-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #deck-stage { width: 1920px; height: 1080px; flex: 0 0 auto; position: relative; overflow: hidden; transform-origin: center center; background: #14213D; }
</style>
</head>
<body>
<div id="deck-viewport"><div id="deck-stage">
<div class="s">
<p class="kick"><span class="b">■</span><span>Typodeck Research · Section</span></p>
<div class="main">
<div class="left">
<p class="sec">Part I — Evidence</p>
<h2 class="ttl">What the reviews actually caught</h2>
<p class="orient">Three patterns, one discipline.</p>
</div>
<p class="num">01</p>
</div>
<div class="foot"><span class="ct">02 / 07</span><span>Typodeck Research</span></div>
</div>
</div></div>
<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
</body>
</html>
