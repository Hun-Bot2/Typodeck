<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modulo — Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  .s { position: absolute; inset: 0; background: #FFFFFF; color: #14213D;
    font-family: 'Inter', system-ui, sans-serif; padding: 64px 120px 0 120px;
    display: flex; flex-direction: column; }
  .kick { display: flex; align-items: center; gap: 12px; margin: 0;
    font-family: 'Sora', sans-serif; font-weight: 600; font-size: 15px;
    letter-spacing: 0.12em; text-transform: uppercase; }
  .kick .b { color: #D98A0B; font-size: 14px; }
  .main { flex: 1; display: flex; gap: 96px; align-items: center; min-height: 0; }
  .left { flex: 1 1 auto; min-width: 0; }
  .hero { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 84px;
    line-height: 1.06; letter-spacing: -0.015em; margin: 0; max-height: 380px; overflow: hidden; }
  .sub { font-size: 27px; line-height: 1.55; color: #3D4C6D; margin: 40px 0 0 0; max-width: 34ch; }
  .facts { flex: 0 0 380px; display: flex; flex-direction: column; gap: 44px; }
  .stat .n { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 120px;
    line-height: 1; letter-spacing: -0.02em; margin: 0; color: #14213D; }
  .stat .l { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 15px;
    letter-spacing: 0.12em; text-transform: uppercase; margin: 12px 0 0 0; }
  .pair .k { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 15px;
    letter-spacing: 0.12em; text-transform: uppercase; color: #3D4C6D; margin: 0; }
  .pair .v { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 30px; margin: 8px 0 0 0; }
  .foot { flex: 0 0 120px; display: flex; align-items: center; justify-content: space-between;
    font-family: 'Sora', sans-serif; font-weight: 600; font-size: 14px;
    letter-spacing: 0.12em; text-transform: uppercase; }
  .foot .ct { color: #14213D; }
</style>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #deck-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #deck-stage { width: 1920px; height: 1080px; flex: 0 0 auto; position: relative; overflow: hidden; transform-origin: center center; background: #fff; }
</style>
</head>
<body>
<div id="deck-viewport"><div id="deck-stage">
<div class="s">
<p class="kick"><span class="b">■</span><span>Typodeck Research · November 2026</span></p>
<div class="main">
<div class="left">
<h1 class="hero" data-autofit="84">The Hidden Cost of Rushing to Ship</h1>
<p class="sub">What 11 postmortems taught us about review discipline</p>
</div>
<div class="facts">
<div class="stat"><p class="n">11</p><p class="l">Postmortems</p></div>
<div class="pair"><p class="k">Case</p><p class="v">Files</p></div>
<div class="pair"><p class="k">Issue</p><p class="v">Nº 01</p></div>
<div class="pair"><p class="k">November 2026</p></div>
</div>
</div>
<div class="foot"><span class="ct">01 / 07</span><span>Typodeck Research</span></div>
</div>
</div></div>
<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<script>
  function __mdAutofit() {
    document.querySelectorAll('[data-autofit]').forEach(function (el) {
      var max = parseFloat(el.getAttribute('data-autofit'));
      var size = max, min = Math.max(40, max * 0.4);
      el.style.fontSize = size + 'px';
      var guard = 60;
      while (guard-- > 0 && size > min && el.scrollHeight > el.clientHeight + 2) { size -= 2; el.style.fontSize = size + 'px'; }
    });
  }
  document.addEventListener('DOMContentLoaded', __mdAutofit);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(__mdAutofit); }
</script>
</body>
</html>
