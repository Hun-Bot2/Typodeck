<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modulo — Evidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  .s { position: absolute; inset: 0; background: #FFFFFF; color: #1C2C4E;
    font-family: 'Inter', system-ui, sans-serif; padding: 64px 120px 0 120px;
    display: flex; flex-direction: column; }
  .kick { display: flex; align-items: center; gap: 12px; margin: 0;
    font-family: 'Sora', sans-serif; font-weight: 600; font-size: 15px;
    letter-spacing: 0.12em; text-transform: uppercase; }
  .kick .b { color: #D98A0B; font-size: 14px; }
  .main { flex: 1; display: flex; gap: 96px; align-items: center; min-height: 0; }
  .stat { flex: 0 0 400px; }
  .stat .n { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 150px;
    line-height: 1; letter-spacing: -0.02em; color: #1C2C4E; margin: 0; }
  .stat .l { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px;
    letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.6; margin: 16px 0 0 0; }
  .txt { flex: 1; min-width: 0; }
  .msg { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 52px;
    line-height: 1.12; letter-spacing: -0.01em; margin: 0; }
  .sup { font-size: 24px; line-height: 1.65; color: #3D4C6D; margin: 28px 0 0 0; max-width: 36ch; }
  .src { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 500;
    color: #3D4C6D; margin: 32px 0 0 0; }
  .src .b { color: #1C2C4E; font-size: 12px; }
  .foot { flex: 0 0 120px; display: flex; align-items: center; justify-content: space-between;
    font-family: 'Sora', sans-serif; font-weight: 600; font-size: 14px;
    letter-spacing: 0.12em; text-transform: uppercase; }
  .foot .ct { color: #1C2C4E; }
</style>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #deck-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #deck-stage { width: 1920px; height: 1080px; flex: 0 0 auto; position: relative; overflow: hidden; transform-origin: center center; background: #fff; }
</style>
</head>
<body>
<div id="deck-viewport"><div id="deck-stage">
<div class="s">
<p class="kick"><span class="b">■</span><span>Finding 01</span></p>
<div class="main">
<div class="stat"><p class="n">63%</p><p class="l">fewer sev-1 rollbacks</p></div>
<div class="txt">
<h2 class="msg">Teams that required a second reviewer before merge contained failures earlier.</h2>
<p class="sup">Review depth predicted containment better than team size, tenure, or tooling.</p>
<p class="src"><span class="b">●</span><span>Fixture data · not a real study</span></p>
</div>
</div>
<div class="foot"><span class="ct">04 / 07</span><span>Typodeck Research</span></div>
</div>
</div></div>
<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
</body>
</html>
