<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modulo Cover — Typodeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* Typography-only: the module grid carries type, not fills. Square/circle
     glyph markers, deep/deep-soft ink on white. No tiles, chips, cells,
     bands, rules, or keyline grid. Amber display type lives on deep grounds
     (see evidence); it is never set on white (contrast). */
  .modulo-slide {
    position: absolute; inset: 0;
    background: #FFFFFF;
    font-family: 'Inter', system-ui, sans-serif;
    color: #14213D;
  }
  .modulo-top { position: absolute; top: 64px; left: 120px; right: 120px; }
  .modulo-kicker-text {
    font-family: 'Sora', "Arial Black", sans-serif; font-weight: 600; font-size: 15px;
    letter-spacing: 0.12em; text-transform: uppercase; color: #14213D; white-space: nowrap;
    margin: 0;
  }
  .modulo-main { position: absolute; top: 232px; left: 120px; right: 120px; bottom: 200px; display: flex; gap: 64px; }
  .modulo-left { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .modulo-title {
    font-family: 'Sora', "Arial Black", sans-serif; font-weight: 800;
    font-size: 88px; line-height: 1.06; letter-spacing: -0.015em;
    color: #14213D; margin: 0; text-wrap: pretty;
    max-width: 1010px;
  }
  .modulo-subtitle { font-size: 27px; line-height: 1.55; color: #3D4C6D; margin: 40px 0 0 0; max-width: 980px; }
  .modulo-right { flex: 0 0 516px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px 48px; align-content: center; }
  .modulo-module { display: flex; flex-direction: column; justify-content: center; gap: 10px; min-height: 200px; }
  .modulo-stat {
    font-family: 'Sora', "Arial Black", sans-serif; font-weight: 800;
    font-size: 84px; line-height: 1; letter-spacing: -0.02em; color: #14213D;
  }
  .modulo-module-label {
    font-family: 'Sora', "Arial Black", sans-serif; font-weight: 600; font-size: 14px;
    letter-spacing: 0.12em; text-transform: uppercase; color: #3D4C6D;
  }
  .modulo-point { display: flex; align-items: baseline; gap: 12px; font-family: 'Sora', "Arial Black", sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; color: #14213D; }
  .modulo-point .mk { font-size: 13px; }
  .modulo-point.dim, .modulo-point.dim .mk { color: #3D4C6D; }
  .modulo-footer { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; }
  .modulo-footer-inner {
    height: 120px; padding: 0 120px; display: flex; align-items: center; justify-content: space-between;
    font-family: 'Sora', "Arial Black", sans-serif; font-weight: 600; font-size: 14px;
    letter-spacing: 0.12em; text-transform: uppercase; color: #3D4C6D;
  }
  .modulo-counter { color: #14213D; }
</style>
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <div class="modulo-slide">
      <div class="modulo-top">
        <p class="modulo-kicker-text">Typodeck Research · November 2026</p>
      </div>
      <div class="modulo-main">
        <div class="modulo-left">
          <h1 class="modulo-title">The Hidden Cost of Rushing to Ship</h1>
          <p class="modulo-subtitle">What 11 postmortems taught us about review discipline</p>
        </div>
        <div class="modulo-right">
          <div class="modulo-module">
            <div class="modulo-stat">11</div>
            <div class="modulo-module-label">Postmortems</div>
          </div>
          <div class="modulo-module">
            <div class="modulo-point"><span class="mk">●</span>Case</div>
            <div class="modulo-point dim"><span class="mk">●</span>Files</div>
          </div>
          <div class="modulo-module">
            <div class="modulo-point"><span class="mk">■</span>Issue</div>
            <div class="modulo-point"><span class="mk">■</span>Nº 01</div>
          </div>
          <div class="modulo-module">
            <div class="modulo-module-label">November 2026</div>
          </div>
        </div>
      </div>
      <div class="modulo-footer">
        <div class="modulo-footer-inner">
          <span class="modulo-counter">01 / 03</span>
          <span>Typodeck Research</span>
        </div>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
