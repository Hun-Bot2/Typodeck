<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modulo Evidence — Typodeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* Typography-only: the stat moment takes the deep slide ground so the
     amber signal survives as display type (amber-on-deep 7.89:1). No tiles,
     chips, bands, rules, or keyline grid. The only background is the
     full-slide solid ground. */
  .modulo-slide {
    position: absolute; inset: 0;
    background: #14213D;
    font-family: 'Inter', system-ui, sans-serif;
    color: #FFFFFF;
  }
  .modulo-top { position: absolute; top: 64px; left: 120px; right: 120px; }
  .modulo-kicker-text {
    font-family: 'Sora', "Arial Black", sans-serif; font-weight: 600; font-size: 15px;
    letter-spacing: 0.12em; text-transform: uppercase; color: #FFFFFF; white-space: nowrap;
    margin: 0;
  }
  .modulo-hero { position: absolute; top: 190px; left: 120px; right: 120px; }
  .modulo-title {
    font-family: 'Sora', "Arial Black", sans-serif; font-weight: 800;
    font-size: 62px; line-height: 1.12; letter-spacing: -0.015em;
    color: #FFFFFF; margin: 0; text-wrap: balance;
  }
  .modulo-stat-row { position: absolute; left: 120px; right: 120px; top: 500px; display: flex; align-items: baseline; gap: 48px; }
  .modulo-stat-num {
    font-family: 'Sora', "Arial Black", sans-serif; font-weight: 800;
    font-size: 128px; line-height: 1; letter-spacing: -0.02em; color: #FCA311;
  }
  .modulo-stat-label {
    font-family: 'Sora', "Arial Black", sans-serif; font-weight: 600; font-size: 22px;
    letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.5; color: #FFFFFF;
  }
  .modulo-low { position: absolute; top: 730px; left: 120px; right: 120px; }
  .modulo-subtitle { font-size: 29px; line-height: 1.55; color: rgba(255, 255, 255, 0.82); margin: 0; max-width: 1200px; }
  .modulo-source {
    margin-top: 28px;
    font-family: 'Sora', "Arial Black", sans-serif; font-weight: 600; font-size: 15px;
    letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255, 255, 255, 0.82);
  }
  .modulo-footer { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; }
  .modulo-footer-inner {
    height: 120px; padding: 0 120px; display: flex; align-items: center; justify-content: space-between;
    font-family: 'Sora', "Arial Black", sans-serif; font-weight: 600; font-size: 14px;
    letter-spacing: 0.12em; text-transform: uppercase; color: #FFFFFF;
  }
  .modulo-counter { color: #FCA311; }
</style>
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <div class="modulo-slide">
      <div class="modulo-top">
        <p class="modulo-kicker-text">Finding 01 · Typodeck Research</p>
      </div>
      <div class="modulo-hero">
        <h1 class="modulo-title">Teams that required a second reviewer before merge contained failures earlier.</h1>
      </div>
      <div class="modulo-stat-row">
        <span class="modulo-stat-num">63%</span>
        <span class="modulo-stat-label">fewer sev-1 rollbacks</span>
      </div>
      <div class="modulo-low">
        <p class="modulo-subtitle">Review depth predicted containment better than team size, tenure, or tooling.</p>
        <p class="modulo-source">Fixture data · not a real study</p>
      </div>
      <div class="modulo-footer">
        <div class="modulo-footer-inner">
          <span class="modulo-counter">02 / 03</span>
          <span>Typodeck Research</span>
        </div>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
