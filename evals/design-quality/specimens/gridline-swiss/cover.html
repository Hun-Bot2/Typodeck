<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typodeck Research Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Typography-only: position, scale, weight, color, whitespace. No rules,
     no rail panel, no grid lines, no bullets, no borders. */
  .gridline-slide {
    position: absolute; inset: 0;
    background: #FFFFFF;
    color: #111111;
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }
  .gridline-slide .columns {
    position: absolute; inset: 0;
    padding: 64px 72px 0 72px;
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px;
    align-content: start;
  }
  .gridline-slide .kicker {
    grid-column: 1 / 9;
    font-family: 'Archivo', "Arial Black", sans-serif;
    font-weight: 600; font-size: 20px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #E30613;
    margin: 0;
  }
  .gridline-slide .title {
    grid-column: 1 / 9;
    font-family: 'Archivo', "Arial Black", sans-serif;
    font-weight: 800; font-size: 118px; line-height: 1.02; letter-spacing: -0.01em;
    margin: 48px 0 0 0;
    text-wrap: pretty;
    max-height: 480px;
    overflow: hidden;
  }
  .gridline-slide .subtitle {
    grid-column: 1 / 8;
    font-size: 34px; line-height: 1.45; font-weight: 400; color: #333333;
    margin: 36px 0 0 0;
  }
  .gridline-slide .folio {
    grid-column: 9 / 13; grid-row: 1 / 6;
    text-align: right;
    align-self: start;
  }
  .gridline-slide .numeral {
    font-family: 'Archivo', "Arial Black", sans-serif;
    font-weight: 800; font-size: 380px; line-height: 0.85; letter-spacing: -0.02em;
    color: #111111;
    margin: 0;
  }
  .gridline-slide .meta { margin: 36px 0 0 0; padding: 0; list-style: none; }
  .gridline-slide .meta li {
    font-size: 19px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
    line-height: 1.5; color: #111111;
    padding: 0; margin: 0 0 20px 0;
  }
  .gridline-slide .meta li span { display: block; color: #6B6B6B; font-size: 16px; }
  .gridline-slide .footer {
    position: absolute; left: 72px; right: 72px; bottom: 0; height: 110px;
    display: flex; align-items: center; justify-content: space-between;
    background: #FFFFFF;
  }
  .gridline-slide .footer .ctx {
    font-size: 20px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
    margin: 0;
  }
  .gridline-slide .footer .idx {
    font-family: 'Archivo', "Arial Black", sans-serif;
    font-weight: 600; font-size: 22px; letter-spacing: 0.12em;
    margin: 0;
  }
</style>
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <div class="gridline-slide">
      <div class="columns">
        <p class="kicker">Postmortem Study · Issue Nº 11</p>
        <h1 class="title" data-autofit="118">The Hidden Cost of Rushing to Ship</h1>
        <p class="subtitle">What 11 postmortems taught us about review discipline</p>
        <aside class="folio">
          <div class="numeral">01</div>
          <ul class="meta">
            <li><span>Cases</span>11 postmortems</li>
            <li><span>Subject</span>Review discipline</li>
            <li><span>Issue</span>November 2026</li>
            <li><span>Format</span>Cover 01 / 24</li>
          </ul>
        </aside>
      </div>
      <div class="footer">
        <p class="ctx">Typodeck Research · November 2026</p>
        <p class="idx">01 / 24</p>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
<script>
  /* Title auto-fit: shrink display type only when content overflows its zone. */
  function __gridlineAutofit() {
    document.querySelectorAll('[data-autofit]').forEach(function (el) {
      var max = parseFloat(el.getAttribute('data-autofit'));
      var size = max, min = Math.max(40, max * 0.35);
      el.style.fontSize = size + 'px';
      var guard = 60;
      while (guard-- > 0 && size > min && el.scrollHeight > el.clientHeight + 2) {
        size -= 4; el.style.fontSize = size + 'px';
      }
    });
  }
  document.addEventListener('DOMContentLoaded', __gridlineAutofit);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(__gridlineAutofit); }
</script>
</body>
</html>
