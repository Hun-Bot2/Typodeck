<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typodeck Research — Finding 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Typography-only: position, scale, weight, color, whitespace. No rules,
     no grid lines, no bullets, no borders. */
  .gridline-slide {
    position: absolute; inset: 0;
    background: #FFFFFF;
    color: #111111;
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }
  .gridline-slide .columns {
    position: absolute; inset: 0;
    padding: 64px 72px 0 72px;
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px;
    align-content: start;
  }
  .gridline-slide .kicker {
    grid-column: 1 / 13;
    font-family: 'Archivo', "Arial Black", sans-serif;
    font-weight: 600; font-size: 20px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #E30613;
    margin: 0;
  }
  .gridline-slide .message {
    grid-column: 1 / 13;
    font-family: 'Archivo', "Arial Black", sans-serif;
    font-weight: 800; font-size: 76px; line-height: 1.06; letter-spacing: -0.01em;
    margin: 48px 0 0 0;
    text-wrap: pretty;
  }
  .gridline-slide .statzone {
    grid-column: 1 / 13;
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px;
    margin-top: 56px;
  }
  .gridline-slide .stat { grid-column: 1 / 5; margin: 0; }
  .gridline-slide .stat .n {
    font-family: 'Archivo', "Arial Black", sans-serif;
    font-weight: 800; font-size: 190px; line-height: 0.95; letter-spacing: -0.02em;
    display: block;
  }
  .gridline-slide .stat .l {
    display: block; margin-top: 18px;
    font-size: 21px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .gridline-slide .support {
    grid-column: 6 / 13;
    margin: 0;
    align-self: center;
    font-size: 36px; line-height: 1.5; font-weight: 400; color: #333333;
  }
  .gridline-slide .footer {
    position: absolute; left: 72px; right: 72px; bottom: 0; height: 110px;
    display: flex; align-items: center; justify-content: space-between;
    background: #FFFFFF;
  }
  .gridline-slide .footer .ctx {
    font-size: 20px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
    margin: 0;
  }
  .gridline-slide .footer .idx {
    font-family: 'Archivo', "Arial Black", sans-serif;
    font-weight: 600; font-size: 22px; letter-spacing: 0.12em;
    margin: 0;
  }
</style>
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <div class="gridline-slide">
      <div class="columns">
        <p class="kicker">Finding 01 · Postmortem Study</p>
        <h1 class="message">Teams that required a second reviewer before merge contained failures earlier.</h1>
        <div class="statzone">
          <p class="stat"><span class="n">63%</span><span class="l">fewer sev-1 rollbacks</span></p>
          <p class="support">Review depth predicted containment better than team size, tenure, or tooling.</p>
        </div>
      </div>
      <div class="footer">
        <p class="ctx">Fixture data · not a real study</p>
        <p class="idx">02 / 24</p>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
