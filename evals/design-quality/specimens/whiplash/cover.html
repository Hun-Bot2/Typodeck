<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiplash — Title Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=EB+Garamond:ital,wght@0,400;1,400&family=Noto+Sans+KR:wght@500&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <div class="wh-slide">
      <div class="wh-arch" aria-hidden="true"></div>
      <div class="wh-echo" aria-hidden="true"></div>
      <div class="wh-field" aria-hidden="true">
        <div class="wh-halo"></div>
        <div class="wh-bloom">❦</div>
        <div class="wh-curl wh-curl-a"></div>
        <div class="wh-curl wh-curl-b"></div>
        <div class="wh-curl wh-curl-c"></div>
      </div>
      <div class="wh-tendril" aria-hidden="true"></div>
      <div class="wh-content">
        <p class="wh-context">Typodeck Research · November 2026</p>
        <h1 class="wh-title">The Hidden Cost of Rushing to Ship</h1>
        <div class="wh-divider" aria-hidden="true"><span class="wh-fleuron">❦</span><span class="wh-line"></span><span class="wh-dot"></span></div>
        <p class="wh-subtitle">What 11 postmortems taught us about review discipline</p>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
<style>
  .wh-slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    background: #F3EDE0;
    overflow: hidden;
  }
  /* Offset arch alcove: left-anchored, not centered. Carries the text column. */
  .wh-arch {
    position: absolute;
    left: 140px;
    top: 64px;
    width: 1070px;
    height: 952px;
    border: 2px solid #8C6A3C;
    border-radius: 400px 400px 0 0;
  }
  .wh-echo {
    position: absolute;
    left: 158px;
    top: 82px;
    width: 1034px;
    height: 916px;
    border: 1px solid #B76E79;
    border-radius: 382px 382px 0 0;
  }
  /* Single tendril inside the arch base (asymmetric: left corner only). */
  .wh-tendril {
    position: absolute;
    left: 190px;
    top: 886px;
    width: 96px;
    height: 96px;
    border: 1px solid #8C6A3C;
    border-right: none;
    border-bottom: none;
    border-radius: 96px 0 0 0;
  }
  /* Right ornament field: halo, bloom, curls. No text, all botanical curves. */
  .wh-field {
    position: absolute;
    left: 1300px;
    top: 64px;
    width: 480px;
    height: 952px;
  }
  .wh-halo {
    position: absolute;
    left: 30px;
    top: 120px;
    width: 400px;
    height: 400px;
    border: 1px solid #B76E79;
    border-radius: 50%;
  }
  .wh-bloom {
    position: absolute;
    left: 0;
    top: 130px;
    width: 460px;
    text-align: center;
    font-family: "EB Garamond", "Cormorant Garamond", "Noto Serif", "Noto Serif KR", "DejaVu Serif", Garamond, serif;
    font-size: 300px;
    line-height: 1;
    color: rgba(140, 106, 60, 0.22);
  }
  .wh-curl {
    position: absolute;
    border: 1px solid #8C6A3C;
  }
  .wh-curl-a {
    left: 180px;
    top: 64px;
    width: 120px;
    height: 120px;
    border-left: none;
    border-bottom: none;
    border-radius: 0 120px 0 0;
  }
  .wh-curl-b {
    left: 60px;
    top: 560px;
    width: 160px;
    height: 160px;
    border-right: none;
    border-top: none;
    border-radius: 0 0 0 160px;
  }
  .wh-curl-c {
    left: 260px;
    top: 640px;
    width: 110px;
    height: 110px;
    border-left: none;
    border-top: none;
    border-radius: 0 0 110px 0;
  }
  /* Top-anchored left-aligned stack inside the arch: context first. */
  .wh-content {
    position: absolute;
    left: 252px;
    top: 214px;
    width: 852px;
    text-align: left;
  }
  .wh-context {
    margin: 0;
    padding-top: 22px;
    position: relative;
    font-family: "Marcellus", "Noto Sans KR", Didot, serif;
    font-weight: 400;
    font-size: 15px;
    line-height: 1.6;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #2F3E33;
  }
  .wh-context::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 64px;
    height: 2px;
    background: #8C6A3C;
    border-radius: 2px;
  }
  .wh-title {
    margin: 30px 0 0 0;
    font-family: "Marcellus", "Noto Serif KR", Didot, "Bodoni MT", serif;
    font-weight: 400;
    font-size: 100px;
    line-height: 1.06;
    letter-spacing: 0;
    color: #2F3E33;
    text-wrap: balance;
  }
  .wh-divider {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 18px;
    margin: 30px 0 0 0;
  }
  .wh-fleuron {
    font-family: "EB Garamond", "Cormorant Garamond", "Noto Serif", "Noto Serif KR", "DejaVu Serif", Garamond, serif;
    font-size: 30px;
    line-height: 1;
    color: #8C6A3C;
  }
  .wh-line {
    display: inline-block;
    width: 320px;
    height: 1px;
    background: #8C6A3C;
  }
  .wh-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #B76E79;
  }
  .wh-subtitle {
    margin: 26px 0 0 0;
    max-width: 720px;
    font-family: "EB Garamond", "Noto Serif KR", Garamond, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 31px;
    line-height: 1.55;
    color: #2F3E33;
  }
</style>
</body>
</html>
