<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cut &amp; Paste — Evidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@600&family=Libre+Franklin:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Typography-only collage: tilted type layers, red stat numeral, Caveat
     hand, ghost outline, plus confetti. No slabs, scraps, tape, stickies,
     badges, or dot grid. */
  .cp-slide {
    position: absolute; inset: 0;
    background: #F4F1EA;
    overflow: hidden;
    color: #141414;
  }
  .cp-ghost {
    position: absolute; left: 70px; bottom: 70px;
    font-family: 'Archivo Black', 'Arial Black', sans-serif;
    font-size: 280px; line-height: 1;
    color: transparent;
    -webkit-text-stroke: 3px rgba(20, 20, 20, 0.16);
    transform: rotate(-6deg);
    user-select: none;
  }
  @supports not (-webkit-text-stroke: 1px black) {
    .cp-ghost { color: rgba(20, 20, 20, 0.14); }
  }
  .cp-eyebrow {
    position: absolute; left: 620px; top: 120px;
    font-family: 'Libre Franklin', system-ui, sans-serif;
    font-weight: 700; font-size: 26px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #D7263D; margin: 0;
  }
  .cp-shout {
    position: absolute; left: 620px; top: 178px; width: 1140px; transform: rotate(-1.2deg);
    font-family: 'Archivo Black', 'Arial Black', sans-serif;
    font-size: 56px; line-height: 1.12; font-weight: 400;
    color: #141414; margin: 0;
  }
  .cp-shout::first-line { color: #D7263D; }
  .cp-sub {
    position: absolute; left: 620px; top: 470px; transform: rotate(1.4deg); width: 900px;
    font-family: 'Libre Franklin', system-ui, sans-serif;
    font-size: 28px; font-weight: 500; line-height: 1.45;
    color: #141414; margin: 0;
  }
  .cp-numeral {
    position: absolute; left: 150px; top: 300px;
    transform: rotate(8deg);
    font-family: 'Archivo Black', 'Arial Black', sans-serif;
    font-size: 170px; line-height: 1; color: #D7263D;
  }
  .cp-statlabel {
    position: absolute; left: 150px; top: 640px; width: 380px;
    font-family: 'Archivo Black', 'Arial Black', sans-serif;
    font-size: 32px; line-height: 1.3; color: #141414; margin: 0;
    transform: rotate(-2deg);
  }
  .cp-hand {
    position: absolute; right: 140px; bottom: 210px; width: 620px;
    transform: rotate(-2.5deg);
    font-family: 'Caveat', cursive; font-size: 40px; font-weight: 600;
    line-height: 1.25; color: #141414; margin: 0; text-align: center;
  }
  .cp-folio {
    position: absolute; right: 140px; bottom: 60px;
    transform: rotate(2deg);
    font-family: 'Archivo Black', 'Arial Black', sans-serif;
    font-size: 26px; color: #141414; white-space: nowrap;
  }
  .cp-plus {
    position: absolute;
    font-family: 'Libre Franklin', system-ui, sans-serif;
    font-size: 40px; font-weight: 500; line-height: 1;
    user-select: none;
  }
</style>
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <section class="cp-slide">
      <div class="cp-ghost" aria-hidden="true">63%</div>
      <span class="cp-plus" style="left:508px;top:140px;color:#1B9AAA;transform:rotate(12deg);" aria-hidden="true">+</span>
      <span class="cp-plus" style="left:520px;top:880px;color:#D7263D;transform:rotate(-10deg);" aria-hidden="true">+</span>
      <span class="cp-plus" style="left:1620px;top:120px;color:#1B9AAA;transform:rotate(20deg);" aria-hidden="true">+</span>
      <span class="cp-plus" style="left:1830px;top:700px;color:#D7263D;transform:rotate(8deg);" aria-hidden="true">+</span>
      <div class="cp-numeral" aria-label="63 percent">63%</div>
      <p class="cp-statlabel">fewer sev-1 rollbacks</p>
      <p class="cp-eyebrow">Finding 01</p>
      <h1 class="cp-shout">Teams that required a second reviewer before merge contained failures earlier.</h1>
      <p class="cp-sub">Review depth predicted containment better than team size, tenure, or tooling.</p>
      <p class="cp-hand">Fixture data · not a real study</p>
      <div class="cp-folio">02 / 03</div>
    </section>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
