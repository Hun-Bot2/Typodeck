<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iron Press — Evidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  .press-slide {
    position: absolute; inset: 0;
    background: #F1E9D6;
    color: #1F1A14;
    font-family: 'EB Garamond', Georgia, serif;
    box-sizing: border-box;
  }
  .press-body {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 96px 220px 120px 220px;
    box-sizing: border-box;
  }
  .press-kicker {
    font-family: 'IM Fell English', Georgia, serif;
    font-size: 24px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #1F1A14; margin: 0;
  }
  .press-title {
    font-family: 'IM Fell English', Georgia, serif;
    font-weight: 400;
    font-size: 68px; line-height: 1.15;
    margin: 28px 0 0 0;
    color: #1F1A14;
    text-wrap: balance;
    max-width: 24ch;
  }
  .press-orn {
    font-family: 'IM Fell English', Georgia, serif;
    color: #7B1E1E; font-size: 34px; margin: 28px 0 0 0;
  }
  .press-stat {
    font-family: 'IM Fell English', Georgia, serif;
    font-size: 80px; line-height: 1;
    margin: 28px 0 0 0; color: #1F1A14;
  }
  .press-stat-cap {
    font-size: 22px; line-height: 1.5;
    margin: 12px 0 0 0; color: #1F1A14;
  }
  .press-sub {
    font-style: italic; font-size: 32px; line-height: 1.55;
    margin: 28px 0 0 0; color: #1F1A14;
    max-width: 36ch;
  }
  .press-source {
    font-size: 22px; line-height: 1.5;
    margin: 20px 0 0 0; color: #4A4A4A;
  }
  .press-pagemark {
    position: absolute; bottom: 88px; left: 0; right: 0;
    text-align: center;
    font-family: 'IM Fell English', Georgia, serif;
    font-size: 22px; color: #1F1A14;
    margin: 0;
  }
  .press-pagemark .o { color: #7B1E1E; }
  .press-pagemark .n { letter-spacing: 0.3em; margin: 0 18px; }
</style>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
  }
  #deck-viewport {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  #deck-stage {
    width: 1920px; height: 1080px; flex: 0 0 auto;
    position: relative; overflow: hidden;
    transform-origin: center center; background: #fff;
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <div class="press-slide">
      <div class="press-body">
        <p class="press-kicker">Finding 01</p>
        <h1 class="press-title">Teams that required a second reviewer before merge contained failures earlier.</h1>
        <p class="press-orn">❦</p>
        <p class="press-stat">63%</p>
        <p class="press-stat-cap">fewer sev-1 rollbacks</p>
        <p class="press-sub">Review depth predicted containment better than team size, tenure, or tooling.</p>
        <p class="press-source">Fixture data · not a real study</p>
      </div>
      <p class="press-pagemark"><span class="o">¶</span><span class="n">2</span><span class="o">¶</span></p>
    </div>
  </div>
</div>
<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
</body>
</html>
