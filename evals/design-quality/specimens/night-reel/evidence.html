<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typodeck — Evidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --white: #F5F5F5;
    --red: #C1121F;
    --smoke: #8A8A8A;
  }
  * { box-sizing: border-box; }
  .nr-slide {
    position: absolute; inset: 0;
    background: var(--black); color: var(--white);
    font-family: Inter, system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  .nr-bar-top {
    flex: 0 0 148px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 96px;
  }
  .nr-bar-top .nr-brand {
    font-family: "Bebas Neue", "Arial Black", sans-serif;
    font-size: 34px; letter-spacing: 0.42em; color: var(--smoke);
  }
  .nr-bar-top .nr-reel {
    font-family: "Bebas Neue", "Arial Black", sans-serif;
    font-size: 34px; letter-spacing: 0.42em; color: #3D3D3D;
  }
  .nr-frame {
    flex: 1; position: relative; min-height: 0;
    background: var(--black);
    display: flex; align-items: flex-end;
    padding: 0 96px 56px;
  }
  .nr-lowthird { position: relative; width: 100%; }
  .nr-kicker {
    font-family: "Bebas Neue", "Arial Black", sans-serif;
    font-size: 40px; letter-spacing: 0.5em; color: var(--red);
    margin-bottom: 16px;
  }
  .nr-stat {
    margin: 0;
    font-family: "Bebas Neue", "Arial Black", sans-serif;
    font-size: 260px; line-height: 0.94; letter-spacing: 0.015em;
    color: var(--white);
  }
  .nr-statlabel {
    margin: 14px 0 0 0;
    font-family: "Bebas Neue", "Arial Black", sans-serif;
    font-size: 36px; letter-spacing: 0.42em; color: var(--smoke);
  }
  .nr-key {
    margin: 26px 0 0;
    font-size: 42px; font-weight: 300; line-height: 1.32;
    color: #E2E2E2; max-width: 1450px;
    word-break: keep-all; overflow-wrap: normal;
  }
  .nr-supporting {
    margin: 20px 0 0;
    font-size: 32px; font-weight: 300; line-height: 1.4;
    color: var(--smoke); max-width: 1400px;
    word-break: keep-all; overflow-wrap: normal;
  }
  .nr-bar-bottom {
    flex: 0 0 132px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 96px;
  }
  .nr-context {
    font-size: 30px; font-weight: 300; letter-spacing: 0.08em; color: var(--smoke);
  }
  .nr-count {
    font-family: "Bebas Neue", "Arial Black", sans-serif;
    font-size: 34px; letter-spacing: 0.3em; color: #3D3D3D;
  }
</style>
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <div class="nr-slide">
      <div class="nr-bar-top">
        <span class="nr-brand">Typodeck Research</span>
        <span class="nr-reel">11 Postmortems</span>
      </div>
      <div class="nr-frame">
        <div class="nr-lowthird">
          <div class="nr-kicker">Finding 01</div>
          <p class="nr-stat">63%</p>
          <p class="nr-statlabel">fewer sev-1 rollbacks</p>
          <p class="nr-key">Teams that required a second reviewer before merge contained failures earlier.</p>
          <p class="nr-supporting">Review depth predicted containment better than team size, tenure, or tooling.</p>
        </div>
      </div>
      <div class="nr-bar-bottom">
        <span class="nr-context">Fixture data · not a real study</span>
        <span class="nr-count">02</span>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
