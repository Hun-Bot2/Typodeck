<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover Slide — D25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  #deck-stage .b-slide {
    position: absolute; inset: 0; overflow: hidden;
    background: #E8F4FF;
    font-family: "Quicksand", system-ui, sans-serif;
  }
  #deck-stage .b-band { position: absolute; left: 0; right: 0; }
  #deck-stage .b-band-top { top: 0; height: 118px; background: #7AF0FF; }
  #deck-stage .b-band-bottom { bottom: 0; height: 92px; background: #FF7AD9; }
  #deck-stage .b-star { position: absolute; line-height: 1; user-select: none; }
  #deck-stage .b-main {
    position: absolute; left: 170px; right: 170px; top: 170px; bottom: 150px;
    display: flex; flex-direction: column; justify-content: center;
  }
  #deck-stage .b-badges { display: flex; gap: 20px; align-items: baseline; margin-bottom: 34px; flex-wrap: wrap; }
  #deck-stage .b-tag {
    font-family: "Baloo 2", "Arial Black", sans-serif;
    font-weight: 700; font-size: 22px; letter-spacing: .12em; text-transform: uppercase;
    line-height: 1.2; color: #1B1F6B;
  }
  #deck-stage .b-tag-pink { color: #D12E7F; }
  #deck-stage .b-badges .b-sep { color: #FF7AD9; font-size: 20px; }
  #deck-stage .b-title {
    font-family: "Baloo 2", "Arial Black", sans-serif;
    font-weight: 700; font-size: 100px; line-height: 1.1;
    color: #1B1F6B; margin: 0 0 26px;
  }
  #deck-stage .b-title .w-pink { color: #D12E7F; }
  #deck-stage .b-title .w-hi { color: #D12E7F; }
  #deck-stage .b-sub {
    font-size: 38px; font-weight: 500; line-height: 1.4;
    color: #3A3F8F; margin: 0 0 34px;
  }
  #deck-stage .b-meta {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 30px;
  }
  #deck-stage .b-context { font-size: 27px; font-weight: 600; color: #1B1F6B; }
  #deck-stage .b-context .b-mini { color: #FF7AD9; font-size: 24px; margin-right: 12px; }
  #deck-stage .b-page {
    font-family: "Baloo 2", "Arial Black", sans-serif; font-weight: 800; font-size: 24px;
    color: #1B1F6B;
  }
</style>
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <div class="b-slide">
      <div class="b-band b-band-top"></div>
      <div class="b-band b-band-bottom"></div>
      <span class="b-star" style="left:60px;top:170px;font-size:40px;color:#B388FF;transform:rotate(8deg);">★</span>
      <span class="b-star" style="left:1810px;top:200px;font-size:48px;color:#FF7AD9;opacity:.7;transform:rotate(-8deg);">★</span>
      <span class="b-star" style="left:60px;top:640px;font-size:40px;color:#B388FF;transform:rotate(8deg);">★</span>
      <span class="b-star" style="left:1830px;top:660px;font-size:40px;color:#B388FF;">★</span>
      <main class="b-main">
        <div class="b-badges">
          <span class="b-tag">★ Research</span><span class="b-sep">★</span>
          <span class="b-tag b-tag-pink">N° 11</span><span class="b-sep">★</span>
          <span class="b-tag">2026</span>
        </div>
        <h1 class="b-title" id="bTitle">The Hidden Cost of Rushing to Ship</h1>
        <p class="b-sub">What 11 postmortems taught us about review discipline</p>
        <div class="b-meta">
          <span class="b-context"><span class="b-mini">★</span>Typodeck Research · November 2026</span>
          <span class="b-page">01</span>
        </div>
      </main>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<script>
  /* Bubble OS word-coloring + overflow guard (progressive enhancement). */
  (function () {
    function paint() {
      var t = document.getElementById('bTitle');
      if (!t || t.dataset.painted) return;
      t.dataset.painted = '1';
      var html = t.textContent;
      if (html.indexOf('Hidden Cost') !== -1) {
        html = html.split('Hidden Cost').join('<span class="w-pink">Hidden Cost</span>');
        html = html.split('Ship').join('<span class="w-hi">Ship</span>');
        t.innerHTML = html;
      } else {
        var parts = html.split(' ');
        if (parts.length > 2) {
          parts[1] = '<span class="w-pink">' + parts[1] + '</span>';
          t.innerHTML = parts.join(' ');
        }
      }
    }
    function fit() {
      var main = document.querySelector('#deck-stage .b-main');
      var t = document.getElementById('bTitle');
      if (!main || !t) return;
      var size = parseFloat(window.getComputedStyle(t).fontSize);
      var guard = 0;
      while (main.scrollHeight > main.clientHeight + 4 && size > 52 && guard < 30) {
        size -= 4; guard++;
        t.style.fontSize = size + 'px';
      }
    }
    function run() { paint(); fit(); }
    document.addEventListener('DOMContentLoaded', run);
    window.addEventListener('load', run);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(run);
  })();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
