<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter &amp; Verse — Evidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
  .cv-slide {
    position: absolute; inset: 0;
    background: #FBF7EF;
    display: flex; flex-direction: column;
    padding: 64px 120px 52px;
    box-sizing: border-box;
    color: #1C1A17;
  }
  .cv-running {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px; font-weight: 500;
    letter-spacing: 0.24em; text-transform: uppercase;
    color: #6B6257;
  }
  .cv-running-rule { height: 1px; background: #B9A88F; margin-top: 18px; }
  .cv-main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; min-height: 0;
  }
  .cv-kicker {
    display: flex; align-items: center; gap: 24px;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 16px; font-weight: 500;
    letter-spacing: 0.34em; text-transform: uppercase;
    color: #7A2E2E; white-space: nowrap;
  }
  .cv-kicker::before, .cv-kicker::after {
    content: ""; display: block; width: 120px; height: 1px; background: #7A2E2E;
  }
  .cv-section-title {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 64px; font-weight: 600; line-height: 1.1;
    color: #1C1A17; margin: 32px 0 0;
    max-width: 1240px; text-wrap: balance;
  }
  .cv-figure { margin: 36px 0 0; }
  .cv-figure-rule { width: 200px; height: 1px; background: #B9A88F; margin: 0 auto; }
  .cv-figure-num {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 68px; font-weight: 600; line-height: 1;
    color: #1C1A17; margin: 28px 0 0;
  }
  .cv-figure-label {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px; font-weight: 500;
    letter-spacing: 0.24em; text-transform: uppercase;
    color: #6B6257; margin: 12px 0 28px;
  }
  .cv-body {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 24px; font-weight: 400; line-height: 1.7;
    color: #1C1A17; max-width: 780px; margin: 32px 0 0;
  }
  .cv-folio-rule { height: 1px; background: #B9A88F; }
  .cv-folio {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-top: 20px;
  }
  .cv-folio-source {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 16px; font-weight: 500; letter-spacing: 0.06em;
    color: #1C1A17;
  }
  .cv-folio-mark {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 18px; color: #7A2E2E;
  }
  .cv-folio-page {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 20px; font-weight: 600; color: #7A2E2E;
  }
</style>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
  }
  #deck-viewport {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  #deck-stage {
    width: 1920px; height: 1080px; flex: 0 0 auto;
    position: relative; overflow: hidden;
    transform-origin: center center; background: #fff;
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <section class="cv-slide">
      <header>
        <div class="cv-running"><span>The Hidden Cost of Rushing to Ship</span><span>November 2026</span></div>
        <div class="cv-running-rule"></div>
      </header>
      <div class="cv-main">
        <div class="cv-kicker">Finding 01</div>
        <h1 class="cv-section-title">Teams that required a second reviewer before merge contained failures earlier.</h1>
        <div class="cv-figure">
          <div class="cv-figure-rule"></div>
          <div class="cv-figure-num">63%</div>
          <div class="cv-figure-label">fewer sev-1 rollbacks</div>
          <div class="cv-figure-rule"></div>
        </div>
        <p class="cv-body">Review depth predicted containment better than team size, tenure, or tooling.</p>
      </div>
      <footer>
        <div class="cv-folio-rule"></div>
        <div class="cv-folio">
          <span class="cv-folio-source">Fixture data · not a real study</span>
          <span class="cv-folio-mark" aria-hidden="true">❦</span>
          <span class="cv-folio-page">2</span>
        </div>
      </footer>
    </section>
  </div>
</div>
<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
</body>
</html>
