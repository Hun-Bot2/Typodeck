<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gilded Line — Evidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Jost:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #0F0E0C; /* Gilded Line surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <style>
      .gd { position: absolute; inset: 0; background: #0F0E0C; color: #F5EFE0;
        font-family: 'Jost', system-ui, sans-serif; display: flex;
        align-items: center; justify-content: center; }
      .gd-panel { width: 1230px; max-height: 980px;
        padding: 30px 60px; text-align: center;
        display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .gd-orn { color: #D4AF37; font-size: 24px; letter-spacing: 0.6em; text-indent: 0.6em;
        margin-bottom: 24px; }
      .gd-kicker { font-family: 'Cinzel', 'Arial Black', sans-serif; font-weight: 400;
        font-size: 24px; letter-spacing: 0.25em; text-indent: 0.25em; color: #D4AF37; }
      .gd-rule { display: flex; align-items: center; gap: 18px; margin: 18px 0;
        color: #D4AF37; font-size: 20px; letter-spacing: 0.4em; text-indent: 0.4em; }
      .gd-rule::before, .gd-rule::after { content: ""; display: block; width: 220px; height: 2px;
        background: #D4AF37; }
      .gd-rule.thin::before, .gd-rule.thin::after { width: 150px; height: 1px; }
      .gd-key { margin: 0; font-family: 'Cinzel', 'Arial Black', sans-serif; font-weight: 700;
        font-size: 36px; line-height: 1.3; letter-spacing: 0.03em; color: #F5EFE0; }
      .gd-stat { margin: 20px 0 0 0; font-family: 'Cinzel', 'Arial Black', sans-serif; font-weight: 700;
        font-size: 110px; line-height: 1; color: #D4AF37; }
      .gd-statlab { margin: 10px 0 0 0; font-family: 'Cinzel', 'Arial Black', sans-serif;
        font-size: 22px; letter-spacing: 0.25em; text-indent: 0.25em; color: #F5EFE0; }
      .gd-sub { margin: 18px 0 0 0; font-size: 27px; font-style: italic; line-height: 1.45;
        color: #D8CFB8; max-width: 26em; }
      .gd-context { margin-top: 22px; font-family: 'Cinzel', 'Arial Black', sans-serif;
        font-size: 20px; letter-spacing: 0.25em; text-indent: 0.25em; color: #D4AF37; }
      .gd-foot { margin-top: 22px; display: flex; align-items: center; gap: 26px;
        font-family: 'Cinzel', 'Arial Black', sans-serif; font-size: 20px;
        letter-spacing: 0.3em; text-indent: 0.3em; color: #D4AF37; }
      .gd-foot .dia { color: #F5EFE0; }
      .gd-side { position: absolute; top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 30px;
        color: #D4AF37; font-size: 22px; }
      .gd-side.left { left: 150px; }
      .gd-side.right { right: 150px; }
      .gd-side .dim { opacity: 0.55; }
    </style>
    <div class="gd">
      <div class="gd-side left"><span>◆</span><span class="dim">◇</span><span>◆</span><span class="dim">◇</span><span>◆</span></div>
      <div class="gd-panel">
        <div class="gd-orn">◇&nbsp;&nbsp;◆&nbsp;&nbsp;◇</div>
        <div class="gd-kicker">◆&nbsp;&nbsp;Finding 01&nbsp;&nbsp;◆</div>
        <div class="gd-rule">◇</div>
        <p class="gd-key">Teams that required a second reviewer before merge contained failures earlier.</p>
        <p class="gd-stat">63%</p>
        <p class="gd-statlab">fewer sev-1 rollbacks</p>
        <p class="gd-sub">Review depth predicted containment better than team size, tenure, or tooling.</p>
        <div class="gd-rule thin">◆</div>
        <div class="gd-context">Fixture data · not a real study</div>
        <div class="gd-foot"><span>№ 11</span><span class="dia">◆</span><span>ANNO MMXXVI</span></div>
      </div>
      <div class="gd-side right"><span>◆</span><span class="dim">◇</span><span>◆</span><span class="dim">◇</span><span>◆</span></div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
