<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin-Op Evidence — Typodeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500&family=Silkscreen:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* Typography-only: glowing type on the void. No frame, rails, screws,
     slots, ticker band, scanlines, vignette, wells, or block cursor. */
  .coinop-slide { position: absolute; inset: 0; background: #060A06; overflow: hidden;
    font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .coinop-stage { position: absolute; inset: 72px; display: flex; flex-direction: column; }
  .coinop-marquee { flex: 0 0 auto; text-align: center;
    font-family: 'Silkscreen', "Arial Black", sans-serif; font-size: 20px;
    letter-spacing: 0.08em; text-transform: uppercase; color: #FFB000; margin: 0;
    text-shadow: 0 0 8px rgba(255,176,0,.8), 0 0 28px rgba(255,176,0,.35); }
  .coinop-well { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 20px 72px; min-height: 0; }
  .coinop-eyebrow { margin: 0 0 20px 0;
    font-family: 'Silkscreen', "Arial Black", sans-serif; font-size: 17px;
    letter-spacing: 0.14em; text-transform: uppercase; color: #FFB000; white-space: nowrap;
    text-shadow: 0 0 8px rgba(255,176,0,.8), 0 0 28px rgba(255,176,0,.35); }
  .coinop-eyebrow .pm { color: #1FA84A; text-shadow: none; padding: 0 16px; }
  .coinop-stat { font-family: 'VT323', ui-monospace, monospace; font-weight: 400;
    font-size: 250px; line-height: 0.9; color: #33FF66; margin: 0;
    text-shadow: 0 0 8px rgba(51,255,102,.9), 0 0 32px rgba(51,255,102,.45), 0 0 90px rgba(51,255,102,.25); }
  .coinop-statlabel { font-family: 'Silkscreen', "Arial Black", sans-serif; font-size: 19px;
    letter-spacing: 0.16em; text-transform: uppercase; color: #E8E4D8; margin: 14px 0 0 0;
    text-shadow: 0 0 6px rgba(232,228,216,.35); }
  .coinop-ticks { color: #1FA84A; font-size: 22px; letter-spacing: 24px; margin: 18px 0 18px 24px; }
  .coinop-key { font-size: 29px; line-height: 1.55; font-weight: 500; color: #E8E4D8; margin: 0; max-width: 60ch;
    text-shadow: 0 0 6px rgba(232,228,216,.35); }
  .coinop-sup { font-size: 23px; line-height: 1.6; color: #1FA84A; margin: 16px 0 0 0; max-width: 66ch; }
  .coinop-footer { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    font-family: 'Silkscreen', "Arial Black", sans-serif; font-size: 13px;
    letter-spacing: 0.18em; text-transform: uppercase; color: #1FA84A; }
  .coinop-cursor { color: #33FF66; font-family: 'VT323', ui-monospace, monospace; font-size: 30px;
    text-shadow: 0 0 6px rgba(51,255,102,.7), 0 0 24px rgba(51,255,102,.35);
    animation: coinop-blink 1.06s steps(1) infinite; }
  @keyframes coinop-blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .coinop-cursor { animation: none; }
  }
</style>
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <div class="coinop-slide">
      <div class="coinop-stage">
        <p class="coinop-marquee">Typodeck Research · November 2026</p>
        <div class="coinop-well">
          <p class="coinop-eyebrow"><span class="pm">+</span>Finding 01<span class="pm">+</span></p>
          <p class="coinop-stat">63%</p>
          <p class="coinop-statlabel">fewer sev-1 rollbacks</p>
          <div class="coinop-ticks">+ + +</div>
          <p class="coinop-key">Teams that required a second reviewer before merge contained failures earlier.</p>
          <p class="coinop-sup">Review depth predicted containment better than team size, tenure, or tooling.</p>
        </div>
        <div class="coinop-footer">
          <span>Page 02</span>
          <span class="coinop-cursor">▊</span>
          <span>Fixture data · not a real study</span>
        </div>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
