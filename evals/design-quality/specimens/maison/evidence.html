<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence Slide — Typodeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  .maison-slide { position: absolute; inset: 0; background: #F7F3EC; }
  .maison-col { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; text-align: center; padding: 150px 12vw 72px; }
  .maison-context { font-family: 'Inter', system-ui, sans-serif; font-weight: 500;
    font-size: 17px; letter-spacing: 0.3em; text-transform: uppercase; color: #77632F;
    margin: 0 0 0 -0.3em; }
  /* Typography-only: hairline rules retired; whitespace frames the column. */
  .maison-stat { font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500; font-size: 120px; line-height: 1.3;
    color: #0B0B0C; margin: 64px 0 0 0; }
  .maison-stat-label { font-family: 'Inter', system-ui, sans-serif; font-weight: 500;
    font-size: 17px; letter-spacing: 0.3em; text-transform: uppercase; color: #77632F;
    margin: 10px 0 0 -0.3em; }
  .maison-message { font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500; font-size: 44px; line-height: 1.32;
    color: #0B0B0C; margin: 32px 0 0; max-width: 60ch; text-wrap: balance; }
  .maison-message em { font-style: italic; color: #77632F; }
  .maison-support { font-family: 'Inter', system-ui, sans-serif; font-weight: 300;
    font-size: 22px; line-height: 1.8; color: rgba(11,11,12,.8); margin: 28px 0 0; max-width: 60ch; }
  .maison-source { font-family: 'Inter', system-ui, sans-serif; font-weight: 300;
    font-size: 16px; line-height: 1.8; color: #9C9C9C; margin: 20px 0 0; }
  .maison-spacer { flex: 1 1 auto; min-height: 24px; }
  .maison-folio { display: flex; align-items: baseline; justify-content: space-between;
    width: 100%; max-width: 1200px; margin-top: 72px; flex: 0 0 auto;
    font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 14px;
    letter-spacing: 0.3em; text-transform: uppercase; }
  .maison-folio-main { color: #0B0B0C; opacity: 0.72; }
  .maison-folio-count { color: #9C9C9C; font-size: 13px; }
</style>
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <div class="maison-slide">
      <div class="maison-col">
        <p class="maison-context">Finding 01</p>
        <p class="maison-stat">63%</p>
        <p class="maison-stat-label">fewer sev-1 rollbacks</p>
        <h1 class="maison-message" id="maison-message">Teams that required a second reviewer before merge contained failures earlier.</h1>
        <p class="maison-support">Review depth predicted containment better than team size, tenure, or tooling.</p>
        <p class="maison-source">Fixture data · not a real study</p>
        <div class="maison-spacer"></div>
        <div class="maison-folio">
          <span class="maison-folio-main">N° 11 · Rushing to Ship</span>
          <span class="maison-folio-count">02 / 03</span>
        </div>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Single italic accent word: applied at render time so the raw markup
     keeps the message contiguous for validators. */
  (function () {
    var t = document.getElementById('maison-message');
    if (!t) return;
    var word = 'contained';
    var text = t.textContent;
    var i = text.indexOf(word);
    if (i === -1) return;
    t.textContent = '';
    t.appendChild(document.createTextNode(text.slice(0, i)));
    var em = document.createElement('em');
    em.textContent = word;
    t.appendChild(em);
    t.appendChild(document.createTextNode(text.slice(i + word.length)));
  })();
</script>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
