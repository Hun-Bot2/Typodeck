<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence Slide — Typodeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <div class="ma-slide">
      <div class="ma-rule" aria-hidden="true"></div>
      <div class="ma-mark ma-mark-tl" aria-hidden="true"></div>
      <div class="ma-mark ma-mark-tr" aria-hidden="true"></div>
      <div class="ma-mark ma-mark-bl" aria-hidden="true"></div>
      <div class="ma-mark ma-mark-br" aria-hidden="true"></div>
      <div class="ma-cluster">
        <div class="ma-numeral" aria-hidden="true">02</div>
        <p class="ma-eyebrow">Finding 01</p>
        <p class="ma-stat">63%</p>
        <p class="ma-stat-label">fewer sev-1 rollbacks</p>
        <p class="ma-message">Teams that required a second reviewer before merge contained failures earlier.</p>
        <div class="ma-hairline" aria-hidden="true"></div>
        <p class="ma-support">Review depth predicted containment better than team size, tenure, or tooling.</p>
        <p class="ma-context">Fixture data · not a real study</p>
        <div class="ma-seal" aria-hidden="true">証</div>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
<style>
  .ma-slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    background: #F8F6F0;
    overflow: hidden;
  }
  .ma-rule {
    position: absolute;
    left: 300px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #2B2B2B;
    opacity: 0.85;
  }
  .ma-mark {
    position: absolute;
    width: 14px;
    height: 14px;
  }
  .ma-mark::before, .ma-mark::after {
    content: "";
    position: absolute;
    background: #D8D2C4;
  }
  .ma-mark::before { left: 6px; top: 0; width: 2px; height: 14px; }
  .ma-mark::after { top: 6px; left: 0; width: 14px; height: 2px; }
  .ma-mark-tl { left: 48px; top: 48px; }
  .ma-mark-tr { right: 48px; top: 48px; }
  .ma-mark-bl { left: 48px; bottom: 48px; }
  .ma-mark-br { right: 48px; bottom: 48px; }
  .ma-cluster {
    position: absolute;
    left: 400px;
    top: 150px;
    width: 1100px;
  }
  .ma-numeral {
    position: absolute;
    top: 40px;
    left: 300px;
    z-index: 0;
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    font-weight: 600;
    font-size: 200px;
    line-height: 1;
    color: #D8D2C4;
    margin: 0;
    pointer-events: none;
  }
  .ma-eyebrow {
    position: relative;
    z-index: 1;
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
    font-weight: 500;
    font-size: 15px;
    line-height: 1.6;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #2B2B2B;
    margin: 0;
  }
  .ma-stat {
    position: relative;
    z-index: 1;
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    font-weight: 600;
    font-size: 128px;
    line-height: 1.1;
    color: #2B2B2B;
    margin: 18px 0 0 0;
  }
  .ma-stat-label {
    position: relative;
    z-index: 1;
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
    font-weight: 500;
    font-size: 15px;
    line-height: 1.6;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #2B2B2B;
    margin: 8px 0 0 0;
  }
  .ma-message {
    position: relative;
    z-index: 1;
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
    font-weight: 400;
    font-size: 30px;
    line-height: 1.7;
    color: #2B2B2B;
    margin: 28px 0 0 0;
  }
  .ma-hairline {
    width: 64px;
    height: 1px;
    background: #2B2B2B;
    opacity: 0.4;
    margin: 32px 0 0 0;
  }
  .ma-support {
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
    font-weight: 400;
    font-size: 21px;
    line-height: 1.9;
    color: #2B2B2B;
    margin: 24px 0 0 0;
  }
  .ma-context {
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
    font-weight: 500;
    font-size: 15px;
    line-height: 1.6;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #2B2B2B;
    margin: 20px 0 0 0;
  }
  .ma-seal {
    color: #A63D2F;
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    font-weight: 600;
    font-size: 44px;
    line-height: 1.4;
    margin: 32px 0 0 0;
  }
</style>
</body>
</html>
