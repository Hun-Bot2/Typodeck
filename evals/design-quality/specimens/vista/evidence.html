<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence Slide — Typodeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
  .vista-slide {
    position: absolute; inset: 0;
    background: #FFFDF6;
    color: #0E3B43;
    font-family: 'Outfit', system-ui, sans-serif;
    display: flex; flex-direction: column;
    box-sizing: border-box;
  }
  .vista-sky {
    flex: 0 0 208px;
    background: #0E3B43;
    color: #F6E7C1;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 120px;
    box-sizing: border-box;
  }
  .vista-kicker {
    margin: 0;
    font-size: 22px; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
  }
  .vista-leafword {
    font-size: 20px; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: #F6E7C1;
  }
  .vista-headband {
    flex: 0 0 auto;
    background: #F6E7C1;
    color: #0E3B43;
    text-align: center;
    padding: 48px 300px 52px 300px;
    box-sizing: border-box;
  }
  .vista-message {
    font-family: 'DM Serif Display', Georgia, serif;
    font-weight: 400;
    font-size: 60px; line-height: 1.12;
    margin: 0;
    text-wrap: balance;
  }
  .vista-figure {
    font-family: 'DM Serif Display', Georgia, serif;
    font-weight: 400;
    font-size: 72px; line-height: 1;
    margin: 28px 0 0 0;
    color: #E4572E;
  }
  .vista-statlabel {
    font-size: 22px; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
    margin: 16px 0 0;
    color: #0E3B43;
  }
  .vista-bodyband {
    flex: 1;
    min-height: 0;
    background: #A8C686;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 24px 300px;
    box-sizing: border-box;
  }
  .vista-sub {
    font-size: 31px; font-weight: 400; line-height: 1.55;
    margin: 0; max-width: 40ch; color: #0E3B43;
  }
  .vista-ground {
    flex: 0 0 108px;
    background: #0A2D34;
    color: #F6E7C1;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 120px;
    box-sizing: border-box;
  }
  .vista-date {
    font-size: 20px; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
    margin: 0;
  }
  .vista-page {
    font-size: 20px; font-weight: 600; letter-spacing: 0.25em;
    margin: 0;
  }
</style>
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <div class="vista-slide">
      <div class="vista-sky">
        <p class="vista-kicker">Finding 01</p>
        <span class="vista-leafword">second reviewer</span>
      </div>
      <div class="vista-headband">
        <h1 class="vista-message">Teams that required a second reviewer before merge contained failures earlier.</h1>
        <p class="vista-figure">63%</p>
        <p class="vista-statlabel">fewer sev-1 rollbacks</p>
      </div>
      <div class="vista-bodyband">
        <p class="vista-sub">Review depth predicted containment better than team size, tenure, or tooling.</p>
      </div>
      <div class="vista-ground">
        <p class="vista-date">Fixture data · not a real study</p>
        <p class="vista-page">02</p>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
