<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fika — Evidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  .fika-slide {
    position: absolute; inset: 0;
    background: #FAFAF7;
    color: #31404B;
    font-family: 'Nunito Sans', system-ui, sans-serif;
    padding: 96px 120px 88px 120px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .fika-kicker {
    font-size: 22px; font-weight: 700;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: #31404B;
    margin: 0;
  }
  .fika-cols {
    flex: 1;
    display: flex; gap: 96px; align-items: center;
    margin-top: 56px;
  }
  .fika-text { flex: 0 0 57%; min-width: 0; }
  .fika-title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 72px;
    line-height: 1.12;
    text-transform: lowercase;
    margin: 0;
    color: #31404B;
  }
  .fika-sub {
    font-size: 30px; line-height: 1.6; font-weight: 400;
    margin: 40px 0 0 0; max-width: 32ch;
  }
  .fika-source {
    font-size: 20px; line-height: 1.5; font-weight: 400;
    margin: 32px 0 0; opacity: 0.72;
  }
  .fika-figure {
    flex: 1;
    box-sizing: border-box;
    display: flex; flex-direction: column;
    align-items: flex-start; justify-content: center;
    align-self: stretch;
    padding-left: 96px;
  }
  .fika-numeral {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500; font-size: 160px; line-height: 1;
    color: #31404B; margin: 0;
  }
  .fika-figure-cap { font-size: 24px; line-height: 1.6; margin: 24px 0 0 0; max-width: 16ch; }
  .fika-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 48px;
  }
  .fika-page { font-size: 20px; font-weight: 700; letter-spacing: 0.2em; }
</style>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
  }
  #deck-viewport {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  #deck-stage {
    width: 1920px; height: 1080px; flex: 0 0 auto;
    position: relative; overflow: hidden;
    transform-origin: center center; background: #fff;
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <div class="fika-slide">
      <p class="fika-kicker">Finding 01</p>
      <div class="fika-cols">
        <div class="fika-text">
          <h1 class="fika-title">Teams that required a second reviewer before merge contained failures earlier.</h1>
          <p class="fika-sub">Review depth predicted containment better than team size, tenure, or tooling.</p>
          <p class="fika-source">Fixture data · not a real study</p>
        </div>
        <div class="fika-figure">
          <p class="fika-numeral">63%</p>
          <p class="fika-figure-cap">fewer sev-1 rollbacks</p>
        </div>
      </div>
      <div class="fika-foot">
        <span class="fika-page">02</span>
      </div>
    </div>
  </div>
</div>
<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
</body>
</html>
