<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Wave Static — Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,700;0,800;0,900;1,700&family=Newsreader:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #FFFFFF; /* New Wave Static surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <style>
      .nw { position: absolute; inset: 0; background: #fff; color: #000;
        font-family: 'Archivo', 'Arial Black', sans-serif; overflow: hidden; }
      .nw-topbar { position: absolute; top: 0; left: 0; right: 0; height: 76px;
        display: flex; align-items: center;
        padding: 0 60px; gap: 26px; font-weight: 700; font-size: 24px; letter-spacing: 0.14em;
        border-bottom: 4px solid #000; }
      .nw-topbar .mag { color: #FF00A8; }
      .nw-topbar .spacer { flex: 1; }
      .nw-topbar .cy { color: #00C2FF; }
      .nw-ghost { position: absolute; right: -70px; bottom: 40px; font-weight: 900;
        font-size: 560px; line-height: 1; color: transparent;
        -webkit-text-stroke: 6px #FF00A8; opacity: 0.65; letter-spacing: -0.05em; }
      .nw-kicker-rot { position: absolute; top: 330px; left: 1490px; transform: rotate(45deg);
        transform-origin: left center; color: #000;
        font-weight: 800; font-size: 30px; letter-spacing: 0.22em;
        white-space: nowrap; }
      .nw-kicker-rot .m { color: #FF00A8; }
      .nw-body { position: absolute; top: 76px; left: 0; bottom: 120px; width: 1290px;
        padding: 64px 40px 0 90px; display: flex; flex-direction: column; }
      .nw-kicker { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
      .nw-kicker .slashes { color: #FF00A8; font-weight: 900; font-size: 30px; letter-spacing: -0.06em; }
      .nw-kicker .txt { font-weight: 800; font-size: 28px; letter-spacing: 0.24em; }
      .nw-title { margin: 0; font-weight: 800; font-size: 104px; line-height: 1.02;
        letter-spacing: -0.02em; word-break: keep-all; max-width: 1210px; }
      .nw-title .it { font-family: 'Newsreader', Georgia, serif; font-style: italic;
        font-weight: 500; color: #FF00A8; letter-spacing: 0; }
      .nw-title .cy { color: #00C2FF; }
      .nw-midrule { display: flex; align-items: center; gap: 14px; margin: 30px 0 26px 0;
        font-weight: 900; font-size: 34px; letter-spacing: -0.04em; }
      .nw-midrule .m { color: #FF00A8; }
      .nw-midrule .c { color: #00C2FF; }
      .nw-sub { margin: 0; font-size: 34px; line-height: 1.4; font-weight: 700; max-width: 22em; }
      .nw-sub .slash { color: #FF00A8; font-weight: 900; }
      .nw-context { margin-top: 26px; display: flex; align-items: baseline; gap: 16px;
        align-self: flex-start; font-weight: 700; font-size: 24px; letter-spacing: 0.1em; }
      .nw-context .mk { color: #FF00A8; font-weight: 900; }
      .nw-foot { position: absolute; left: 0; right: 0; bottom: 0; height: 120px;
        display: flex; align-items: center; padding: 0 60px; gap: 30px;
        border-top: 4px solid #000;
        font-weight: 700; font-size: 24px; letter-spacing: 0.18em; }
      .nw-foot .n11 { font-weight: 900; font-size: 44px; color: #FF00A8; letter-spacing: 0; }
      .nw-foot .spacer { flex: 1; }
      .nw-foot .pg { font-weight: 900; font-size: 30px; letter-spacing: 0.2em; }
    </style>
    <div class="nw">
      <div class="nw-topbar"><span class="mag">TYPODECK</span><span>RESEARCH</span><span class="spacer"></span><span class="cy">NOV 2026</span><span>/ 11 CASES</span></div>
      <div class="nw-ghost" aria-hidden="true">11</div>
      <div class="nw-kicker-rot">READ THE FAILURE LOG <span class="m">▸▸▸</span></div>
      <div class="nw-body">
        <div class="nw-kicker"><span class="slashes">///</span><span class="txt">POSTMORTEM SERIES</span></div>
        <h1 class="nw-title" id="nwTitle">The Hidden Cost of Rushing to Ship</h1>
        <div class="nw-midrule"><span>///</span><span class="m">///</span><span class="c">///</span></div>
        <p class="nw-sub"><span class="slash">///</span> What 11 postmortems taught us about review discipline</p>
        <div class="nw-context"><span class="mk">▸</span><span>Typodeck Research · November 2026</span></div>
      </div>
      <div class="nw-foot">
        <span class="n11">11</span><span>POSTMORTEMS ─ ONE WARNING</span><span class="spacer"></span><span class="pg">P. 01</span>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
<script>
  /* New Wave Static accent-word styling (progressive enhancement).
     The title is a single text source; accent spans are applied at render time
     by word-token position (3rd word = magenta intruder, last word = cyan
     payoff) so mechanical CJK swaps keep their accents. */
  (function () {
    function paint() {
      var t = document.getElementById('nwTitle');
      if (!t || t.dataset.painted) return;
      t.dataset.painted = '1';
      var words = t.textContent.split(' ');
      if (words.length < 2) return;
      var itIdx = words.length > 2 ? 2 : 0;
      var cyIdx = words.length - 1;
      if (cyIdx === itIdx) return;
      function esc(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      t.innerHTML = words.map(function (w, i) {
        var x = esc(w);
        if (i === itIdx) return '<span class="it">' + x + '</span>';
        if (i === cyIdx) return '<span class="cy">' + x + '</span>';
        return x;
      }).join(' ');
      t.setAttribute('aria-label', words.join(' '));
    }
    document.addEventListener('DOMContentLoaded', paint);
    window.addEventListener('load', paint);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(paint);
  })();
</script>
</body>
</html>
