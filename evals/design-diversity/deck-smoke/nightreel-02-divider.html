<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where Reviews Quietly Fail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  .nr-slide { position: absolute; inset: 0; background: #000000; color: #F5F5F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; }
  .nr-bar-top { flex: 0 0 148px; border-bottom: 1px solid #2A2A2A; display: flex; align-items: center; justify-content: space-between; padding: 0 96px; }
  .nr-bar-top .nr-brand { font-family: "Bebas Neue", "Arial Black", sans-serif; font-size: 34px; letter-spacing: 0.42em; color: #8A8A8A; }
  .nr-bar-top .nr-reel { font-family: "Bebas Neue", "Arial Black", sans-serif; font-size: 34px; letter-spacing: 0.42em; color: #3D3D3D; }
  .nr-frame { flex: 1; position: relative; min-height: 0; background: radial-gradient(ellipse 90% 75% at 50% 42%, #161616 0%, #0A0A0A 52%, #000000 78%); display: flex; align-items: flex-end; padding: 0 96px 64px; }
  .nr-frame::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0px, transparent 5px, rgba(255,255,255,0.012) 5px, rgba(255,255,255,0.012) 6px); pointer-events: none; }
  .nr-lowthird { position: relative; width: 100%; }
  .nr-rule { width: 132px; height: 8px; background: #C1121F; margin-bottom: 34px; }
  .nr-kicker { font-family: "Bebas Neue", "Arial Black", sans-serif; font-size: 40px; letter-spacing: 0.5em; color: #8A8A8A; margin-bottom: 22px; }
  .nr-sectitle { margin: 0; font-family: "Bebas Neue", "Arial Black", sans-serif; font-size: 120px; line-height: 0.96; letter-spacing: 0.015em; color: #F5F5F5; text-transform: uppercase; }
  .nr-subtitle { margin: 30px 0 0; font-size: 44px; font-weight: 300; line-height: 1.35; color: #C9C9C9; max-width: 1400px; }
  .nr-bar-bottom { flex: 0 0 132px; border-top: 1px solid #2A2A2A; display: flex; align-items: center; justify-content: space-between; padding: 0 96px; }
  .nr-context { font-size: 30px; font-weight: 300; letter-spacing: 0.08em; color: #8A8A8A; }
  .nr-count { font-family: "Bebas Neue", "Arial Black", sans-serif; font-size: 34px; letter-spacing: 0.3em; color: #3D3D3D; }
</style>
<!-- SCAFFOLD-EMBED-START -->
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #deck-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #deck-stage { width: 1920px; height: 1080px; flex: 0 0 auto; position: relative; overflow: hidden; transform-origin: center center; background: #fff; }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <div class="nr-slide">
      <div class="nr-bar-top"><span class="nr-brand">Typodeck Research</span><span class="nr-reel">Part Two</span></div>
      <div class="nr-frame">
        <div class="nr-lowthird">
          <div class="nr-rule"></div>
          <div class="nr-kicker">Part Two · Findings</div>
          <h1 class="nr-sectitle">Where Reviews Quietly Fail</h1>
          <p class="nr-subtitle">Three patterns, eleven cases, one missing habit</p>
        </div>
      </div>
      <div class="nr-bar-bottom"><span class="nr-context">Typodeck Research · November 2026</span><span class="nr-count">02</span></div>
    </div>
  </div>
</div>
<script>
  function __typodeckFitStage() { var stage = document.getElementById('deck-stage'); if (!stage) return; var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); stage.style.transform = 'scale(' + scale + ')'; }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
