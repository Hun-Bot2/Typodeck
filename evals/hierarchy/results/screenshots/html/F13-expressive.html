      var s = document.createElement('script');
      s.id = 'typodeck-overflow'; s.type = 'application/json';

      document.body.appendChild(s);

  }
  if (document.readyState === 'complete') collect();
  else window.addEventListener('load', collect);
})();</script></body></html>
