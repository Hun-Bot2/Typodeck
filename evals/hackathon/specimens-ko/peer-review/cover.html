<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peer Review KO — Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;0,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --paper: #FFFFFF; --ink: #1A1A1A; --blue: #0B5394; --rule: #EAEAEA;
    --abstract-tint: #F3F5F8; --muted: #5A6470; }
  * { box-sizing: border-box; }
  .pr-slide { position: absolute; inset: 0; background: var(--paper); color: var(--ink);
    font-family: "Noto Serif KR", "STIX Two Text", Georgia, serif;
    padding: 56px 88px 48px; display: flex; flex-direction: column; }
  .sans { font-family: 'Pretendard Variable', Pretendard, Inter, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
  .pr-runhead { display: flex; justify-content: space-between; align-items: baseline;
    font-family: 'Pretendard Variable', Pretendard, Inter, sans-serif;
    font-size: 21px; font-weight: 600; letter-spacing: 0; color: var(--ink); word-break: keep-all; }
  .pr-runhead .pr-page { color: var(--muted); }
  .pr-double-rule { margin-top: 18px; border-top: 3px solid var(--ink); position: relative; }
  .pr-double-rule::after { content: ""; display: block; border-top: 1px solid var(--ink); margin-top: 3px; }
  .pr-main { flex: 1; display: flex; gap: 72px; margin-top: 48px; min-height: 0; }
  .pr-article { flex: 1.85; min-width: 0; display: flex; flex-direction: column; }
  .pr-kicker { font-family: 'Pretendard Variable', Pretendard, Inter, sans-serif;
    font-size: 23px; font-weight: 700; letter-spacing: 0; color: var(--blue); word-break: keep-all; }
  .pr-titlebox { margin-top: 26px; max-height: 430px; overflow: hidden; }
  .pr-title { margin: 0; font-size: 78px; font-weight: 700; line-height: 1.16;
    letter-spacing: 0; color: var(--ink); text-wrap: balance; word-break: keep-all; }
  .pr-abstract { margin-top: 36px; background: var(--abstract-tint);
    border-left: 6px solid var(--blue); padding: 28px 34px 30px; }
  .pr-abstract-label { font-family: 'Pretendard Variable', Pretendard, Inter, sans-serif;
    font-size: 21px; font-weight: 700; letter-spacing: 0; color: var(--ink); margin-bottom: 14px; }
  .pr-abstract-text { margin: 0; font-style: normal; font-weight: 500; font-size: 33px;
    line-height: 1.65; color: var(--ink); word-break: keep-all; }
  .pr-keywords { margin-top: 20px; padding-top: 16px; border-top: 1px solid #D8DEE5;
    font-family: 'Pretendard Variable', Pretendard, Inter, sans-serif;
    font-size: 21px; font-weight: 500; color: var(--muted); word-break: keep-all; }
  .pr-keywords strong { font-weight: 700; color: var(--ink); }
  .pr-rail { flex: 1; min-width: 0; border-left: 1px solid var(--rule);
    padding-left: 60px; display: flex; flex-direction: column; gap: 40px; }
  .pr-fig-label { font-family: 'Pretendard Variable', Pretendard, Inter, sans-serif;
    font-size: 21px; font-weight: 700; letter-spacing: 0; color: var(--ink); }
  .pr-fig-title { font-family: 'Pretendard Variable', Pretendard, Inter, sans-serif;
    font-size: 24px; font-weight: 600; color: var(--ink); margin: 12px 0 20px; word-break: keep-all; }
  .pr-bars { display: flex; flex-direction: column; gap: 13px; }
  .pr-bar-row { display: flex; align-items: center; gap: 14px; }
  .pr-bar-row .pr-bar-cat { font-family: 'Pretendard Variable', Pretendard, Inter, sans-serif;
    font-size: 19px; font-weight: 600; color: var(--muted); width: 64px; flex: 0 0 auto;
    text-align: right; font-variant-numeric: tabular-nums; }
  .pr-bar-track { flex: 1; height: 22px; background: #EDF0F4; position: relative; }
  .pr-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); }
  .pr-bar-row .pr-bar-val { font-family: 'Pretendard Variable', Pretendard, Inter, sans-serif;
    font-size: 19px; font-weight: 700; color: var(--ink); width: 30px; flex: 0 0 auto;
    font-variant-numeric: tabular-nums; }
  .pr-caption { margin: 16px 0 0; font-family: 'Pretendard Variable', Pretendard, Inter, sans-serif;
    font-size: 21px; line-height: 1.6; color: var(--muted); word-break: keep-all; }
  .pr-caption strong { color: var(--ink); font-weight: 700; }
  .pr-footnotes { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--ink);
    font-family: 'Pretendard Variable', Pretendard, Inter, sans-serif;
    font-size: 20px; line-height: 1.6; color: var(--muted); display: flex; gap: 48px; word-break: keep-all; }
  .pr-footnotes .pr-fn sup { font-weight: 700; color: var(--blue); margin-right: 6px; }
  .nw { white-space: nowrap; }
</style>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #deck-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #deck-stage { width: 1920px; height: 1080px; flex: 0 0 auto; position: relative; overflow: hidden;
    transform-origin: center center; background: #fff; }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <div class="pr-slide">
      <div class="pr-runhead"><span>Typodeck 리서치 · 2026년 11월</span><span class="pr-page">p. 01</span></div>
      <div class="pr-double-rule"></div>
      <div class="pr-main">
        <div class="pr-article">
          <div class="pr-kicker">연구 논문 · 리뷰 관행</div>
          <div class="pr-titlebox"><h1 class="pr-title">Shipgate는 <span class="nw">main 브랜치</span>를 항상 푸르게 유지한다</h1></div>
          <div class="pr-abstract">
            <div class="pr-abstract-label">초록</div>
            <p class="pr-abstract-text">깨진 <span class="nw">main 브랜치</span>의 금요일을 끝내는 모노레포용 머지 큐</p>
            <div class="pr-keywords"><strong>키워드</strong> — 머지 큐 · 리뷰 규율 · <span class="nw">v2.3.1</span></div>
          </div>
        </div>
        <div class="pr-rail">
          <div class="pr-fig">
            <div class="pr-fig-label">그림 1</div>
            <div class="pr-fig-title">표본 속 리뷰 적용 범위</div>
            <div class="pr-bars">
              <div class="pr-bar-row"><span class="pr-bar-cat">P01</span><span class="pr-bar-track"><span class="pr-bar-fill" style="width:82%"></span></span><span class="pr-bar-val">9</span></div>
              <div class="pr-bar-row"><span class="pr-bar-cat">P02</span><span class="pr-bar-track"><span class="pr-bar-fill" style="width:64%"></span></span><span class="pr-bar-val">7</span></div>
              <div class="pr-bar-row"><span class="pr-bar-cat">P03</span><span class="pr-bar-track"><span class="pr-bar-fill" style="width:73%"></span></span><span class="pr-bar-val">8</span></div>
              <div class="pr-bar-row"><span class="pr-bar-cat">P04</span><span class="pr-bar-track"><span class="pr-bar-fill" style="width:45%"></span></span><span class="pr-bar-val">5</span></div>
              <div class="pr-bar-row"><span class="pr-bar-cat">P05</span><span class="pr-bar-track"><span class="pr-bar-fill" style="width:55%"></span></span><span class="pr-bar-val">6</span></div>
            </div>
            <p class="pr-caption"><strong>그림 1.</strong> 낮은 막대는 서둘러 낸 배포를 뜻한다.</p>
          </div>
        </div>
      </div>
      <div class="pr-footnotes">
        <span class="pr-fn"><sup>[1]</sup>표본: 서둘러 낸 배포의 포스트모템 11건.</span>
        <span class="pr-fn"><sup>[2]</sup>범위: 리뷰 규율에 한정. <span class="nw">idea.txt:4</span></span>
      </div>
    </div>
  </div>
</div>
<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
</body>
</html>
