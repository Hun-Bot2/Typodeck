<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fika KO — Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Fraunces:wght@500&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  .fika-slide { position: absolute; inset: 0; background: #FAFAF7; color: #3D4A54;
    font-family: 'SUIT Variable', SUIT, 'Nunito Sans', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    padding: 96px 120px 88px 120px; box-sizing: border-box; display: flex; flex-direction: column; }
  .fika-kicker { display: flex; align-items: center; gap: 18px;
    font-size: 23px; font-weight: 700; letter-spacing: 0; color: #3D4A54; word-break: keep-all; }
  .fika-dot { width: 14px; height: 14px; border-radius: 999px; background: #7FA6C9; flex: 0 0 auto; }
  .fika-cols { flex: 1; display: flex; gap: 96px; align-items: center; margin-top: 56px; }
  .fika-text { flex: 0 0 57%; min-width: 0; }
  .fika-title { font-family: 'Noto Serif KR', 'Fraunces', Georgia, serif;
    font-weight: 600; font-size: 76px; line-height: 1.2; margin: 0; color: #3D4A54;
    text-wrap: balance; word-break: keep-all; }
  .fika-rule { height: 2px; border-radius: 2px; background: #DCE8E3; margin: 48px 0 36px 0; max-width: 560px; }
  .fika-sub { font-size: 32px; line-height: 1.6; font-weight: 400; margin: 0; max-width: 28ch; word-break: keep-all; }
  .fika-panel { flex: 1; background: #DCE8E3; border-radius: 24px; padding: 72px 56px;
    box-sizing: border-box; display: flex; flex-direction: column;
    align-items: flex-start; justify-content: center; align-self: stretch;
    box-shadow: 0 8px 24px rgba(61, 74, 84, 0.08); }
  .fika-numeral { font-family: 'Fraunces', Georgia, serif; font-weight: 500;
    font-size: 240px; line-height: 1; color: #3D4A54; margin: 0; }
  .fika-panel-cap { font-size: 26px; line-height: 1.6; margin: 24px 0 0 0; max-width: 16ch; word-break: keep-all; }
  .fika-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 48px; }
  .fika-page { font-size: 20px; font-weight: 700; letter-spacing: 0; }
  .fika-context { font-size: 20px; font-weight: 400; opacity: 0.72; word-break: keep-all; }
  .nw { white-space: nowrap; }
</style>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #deck-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #deck-stage { width: 1920px; height: 1080px; flex: 0 0 auto; position: relative; overflow: hidden;
    transform-origin: center center; background: #FAFAF7; }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <div class="fika-slide">
      <div class="fika-kicker"><span class="fika-dot"></span><span>Typodeck 리서치 · 2026년 11월</span></div>
      <div class="fika-cols">
        <div class="fika-text">
          <h1 class="fika-title">Shipgate는 <span class="nw">main 브랜치</span>를 항상 푸르게 유지한다</h1>
          <div class="fika-rule"></div>
          <p class="fika-sub">깨진 <span class="nw">main 브랜치</span>의 금요일을 끝내는 모노레포용 머지 큐</p>
        </div>
        <div class="fika-panel">
          <p class="fika-numeral">11</p>
          <p class="fika-panel-cap">포스트모템 표본 수 (<span class="nw">PM-01 … PM-11</span>)</p>
        </div>
      </div>
      <div class="fika-foot">
        <span class="fika-context">쇼케이스 · <span class="nw">v2.3.1</span> 기준</span>
        <span class="fika-page">01</span>
      </div>
    </div>
  </div>
</div>
<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
</body>
</html>
