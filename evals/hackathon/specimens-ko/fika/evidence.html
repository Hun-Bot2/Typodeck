<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fika KO — Evidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Fraunces:wght@500&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  .fika-slide { position: absolute; inset: 0; background: #FAFAF7; color: #3D4A54;
    font-family: 'SUIT Variable', SUIT, 'Nunito Sans', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    padding: 96px 120px 88px 120px; box-sizing: border-box; display: flex; flex-direction: column; }
  .fika-kicker { display: flex; align-items: center; gap: 18px;
    font-size: 23px; font-weight: 700; letter-spacing: 0; color: #3D4A54; word-break: keep-all; }
  .fika-dot { width: 14px; height: 14px; border-radius: 999px; background: #E8B4A0; flex: 0 0 auto; }
  .fika-cols { flex: 1; display: flex; gap: 96px; align-items: center; margin-top: 56px; }
  .fika-text { flex: 0 0 52%; min-width: 0; }
  .fika-title { font-family: 'Noto Serif KR', 'Fraunces', Georgia, serif;
    font-weight: 600; font-size: 64px; line-height: 1.2; margin: 0; color: #3D4A54;
    text-wrap: balance; word-break: keep-all; }
  .fika-rule { height: 2px; border-radius: 2px; background: #F5DCD2; margin: 44px 0 32px 0; max-width: 560px; }
  .fika-sub { font-size: 30px; line-height: 1.6; font-weight: 400; margin: 0; word-break: keep-all; }
  .fika-cards { flex: 1; display: flex; flex-direction: column; gap: 28px; align-self: stretch; justify-content: center; }
  .fika-card { border-radius: 24px; padding: 44px 52px; display: flex; align-items: baseline; gap: 28px;
    box-shadow: 0 8px 24px rgba(61, 74, 84, 0.08); }
  .fika-card.sage { background: #DCE8E3; } .fika-card.blush { background: #F5DCD2; }
  .fika-card.blue { background: #D5E4F1; }
  .fika-card .n { font-family: 'Noto Serif KR', 'Fraunces', serif; font-weight: 600;
    font-size: 96px; line-height: 1; }
  .fika-card .d { font-size: 26px; line-height: 1.6; word-break: keep-all; }
  .fika-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 48px; }
  .fika-page { font-size: 20px; font-weight: 700; letter-spacing: 0; }
  .fika-context { font-size: 20px; font-weight: 400; opacity: 0.72; word-break: keep-all; }
  .nw { white-space: nowrap; }
</style>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #deck-viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #deck-stage { width: 1920px; height: 1080px; flex: 0 0 auto; position: relative; overflow: hidden;
    transform-origin: center center; background: #FAFAF7; }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <div class="fika-slide">
      <div class="fika-kicker"><span class="fika-dot"></span><span>증거 · 표본으로 읽는 실패</span></div>
      <div class="fika-cols">
        <div class="fika-text">
          <h1 class="fika-title">서두른 배포일수록<br>리뷰가 비어 있다</h1>
          <div class="fika-rule"></div>
          <p class="fika-sub">11건 가운데 7건이 리뷰 생략 뒤의 금요일 배포였고, 깨진 <span class="nw">main 브랜치</span>의 64%가 같은 구간에서 나왔다.</p>
        </div>
        <div class="fika-cards">
          <div class="fika-card sage"><span class="n">7</span><span class="d">리뷰를 건너뛴 긴급 배포 (<span class="nw">PM-01 … PM-07</span>)</span></div>
          <div class="fika-card blush"><span class="n">64%</span><span class="d">금요일에 깨진 <span class="nw">main 브랜치</span>의 비중</span></div>
          <div class="fika-card blue"><span class="n">1</span><span class="d">전체 리뷰를 통과해 무사고였던 사례</span></div>
        </div>
      </div>
      <div class="fika-foot">
        <span class="fika-context">출처 <span class="nw">idea.txt:4</span> · 미검증 · 예시</span>
        <span class="fika-page">02</span>
      </div>
    </div>
  </div>
</div>
<script>
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
</body>
</html>
