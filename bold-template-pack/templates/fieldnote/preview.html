<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typodeck — Title Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Karla:wght@400;500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --kraft: #E9DCC8;
    --kraft-deep: #DCCDAF;
    --moss: #2E3B2E;
    --leaf: #5A7A4E;
    --clay: #B4552D;
  }
  * { box-sizing: border-box; }
  .fn-slide {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 120% 100% at 50% 0%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0) 55%),
      repeating-linear-gradient(0deg, transparent 0px, transparent 7px, rgba(120,100,70,0.045) 7px, rgba(120,100,70,0.045) 8px),
      var(--kraft);
    color: var(--moss);
    font-family: Karla, system-ui, sans-serif;
    padding: 88px 110px 80px;
    display: flex; gap: 80px;
  }
  .fn-main { flex: 1.6; min-width: 0; display: flex; flex-direction: column; }
  .fn-stamprow { display: flex; align-items: center; gap: 28px; margin-bottom: 44px; }
  .fn-stamp {
    display: inline-block;
    font-family: Karla, system-ui, sans-serif;
    font-size: 26px; font-weight: 700;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--clay);
    border: 3px solid var(--clay);
    outline: 1px solid var(--clay);
    outline-offset: 5px;
    border-radius: 4px;
    padding: 14px 22px 12px 28px;
    transform: rotate(-3deg);
    background: rgba(255,255,255,0.25);
  }
  .fn-stamp-sub {
    font-family: Caveat, cursive;
    font-size: 44px; font-weight: 600; color: var(--leaf);
    transform: rotate(-2deg);
  }
  .fn-titlebox { max-height: 470px; overflow: hidden; }
  .fn-title {
    margin: 0;
    font-family: "Zilla Slab", Georgia, serif;
    font-size: 108px; font-weight: 600; line-height: 1.04;
    letter-spacing: -0.005em; color: var(--moss);
  }
  .fn-underscore {
    width: 340px; height: 10px; background: var(--clay);
    border-radius: 6px; margin-top: 30px;
    transform: rotate(-0.6deg);
  }
  .fn-subtitle {
    margin: 34px 0 0;
    font-size: 42px; font-weight: 500; line-height: 1.4; color: var(--moss);
    max-width: 1050px;
  }
  .fn-leaves { margin-top: 36px; display: flex; gap: 40px; }
  .fn-leaf-item {
    display: flex; align-items: center; gap: 14px;
    font-size: 27px; font-weight: 700; color: var(--leaf);
  }
  .fn-leaf {
    width: 26px; height: 26px; flex: 0 0 auto;
    background: var(--leaf);
    border-radius: 0 60% 0 60%;
    transform: rotate(-12deg);
  }
  .fn-context {
    margin-top: auto; padding-top: 30px;
    font-size: 27px; font-weight: 700;
    letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--moss);
    border-top: 2px dashed rgba(46,59,46,0.45);
  }
  .fn-margin {
    flex: 1; min-width: 0;
    border-left: 2px dashed rgba(46,59,46,0.45);
    padding-left: 64px; padding-top: 12px;
    display: flex; flex-direction: column;
  }
  .fn-note {
    font-family: Caveat, cursive;
    font-size: 52px; font-weight: 600; line-height: 1.25;
    color: var(--clay);
    transform: rotate(1.5deg);
  }
  .fn-arrow { margin: 6px 0 0 30px; transform: rotate(8deg); }
  .fn-tally {
    margin-top: 44px;
    border: 2px solid var(--leaf); border-radius: 4px;
    padding: 26px 30px;
    background: rgba(255,255,255,0.3);
    transform: rotate(-1deg);
  }
  .fn-tally-label {
    font-size: 22px; font-weight: 700;
    letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--leaf);
  }
  .fn-tally-num {
    font-family: "Zilla Slab", Georgia, serif;
    font-size: 120px; font-weight: 700; line-height: 1;
    color: var(--moss); margin-top: 8px;
  }
  .fn-tally-cap {
    font-family: Caveat, cursive;
    font-size: 40px; font-weight: 600; color: var(--moss);
    margin-top: 4px;
  }
  .fn-margin-note {
    margin-top: auto;
    font-family: Caveat, cursive;
    font-size: 44px; font-weight: 600; line-height: 1.3;
    color: var(--leaf);
    transform: rotate(-1deg);
  }
</style>
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <div class="fn-slide">
      <div class="fn-main">
        <div class="fn-stamprow">
          <span class="fn-stamp">Study N&#186; 11</span>
          <span class="fn-stamp-sub">fresh from the field!</span>
        </div>
        <div class="fn-titlebox">
          <h1 class="fn-title" id="fnTitle">The Hidden Cost of Rushing to Ship</h1>
        </div>
        <div class="fn-underscore"></div>
        <p class="fn-subtitle">What 11 postmortems taught us about review discipline</p>
        <div class="fn-leaves">
          <span class="fn-leaf-item"><span class="fn-leaf"></span>postmortems</span>
          <span class="fn-leaf-item"><span class="fn-leaf"></span>review discipline</span>
          <span class="fn-leaf-item"><span class="fn-leaf"></span>shipping</span>
        </div>
        <div class="fn-context">Typodeck Research · November 2026</div>
      </div>
      <div class="fn-margin">
        <div class="fn-note">slow down &amp;<br>look closer&#8230;</div>
        <svg class="fn-arrow" width="120" height="90" viewBox="0 0 120 90" fill="none" aria-hidden="true">
          <path d="M14 8 C 50 30, 70 44, 92 72" stroke="#B4552D" stroke-width="6" stroke-linecap="round"/>
          <path d="M74 68 L92 74 L84 90" stroke="#B4552D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <div class="fn-tally">
          <div class="fn-tally-label">Postmortems read</div>
          <div class="fn-tally-num">11</div>
          <div class="fn-tally-cap">every one worth it</div>
        </div>
        <div class="fn-margin-note">&#10003; review first, ship second</div>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
<script>
  /* Title auto-fit: shrink display title until it fits its box (LONG-variant safety). */
  (function () {
    function fit() {
      var t = document.getElementById('fnTitle');
      if (!t) return;
      var box = t.parentElement;
      var budget = (parseFloat(getComputedStyle(box).maxHeight) || 470) - 6;
      var size = 108;
      t.style.fontSize = size + 'px';
      while (size > 44 && t.getBoundingClientRect().height > budget) {
        size -= 2;
        t.style.fontSize = size + 'px';
      }
    }
    document.addEventListener('DOMContentLoaded', fit);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    window.addEventListener('load', fit);
    setTimeout(fit, 800);
    setTimeout(fit, 2000);
  })();
</script>
</body>
</html>
