<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cut &amp; Paste — Title Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@600&family=Libre+Franklin:wght@400;500&display=swap" rel="stylesheet">
<style>
  .cp-slide {
    position: absolute; inset: 0;
    background-color: #F4F1EA;
    background-image: radial-gradient(rgba(20, 20, 20, 0.07) 1.5px, transparent 1.5px);
    background-size: 28px 28px;
    overflow: hidden;
    color: #141414;
  }
  .cp-ghost {
    position: absolute; right: 10px; top: 210px;
    font-family: 'Archivo Black', 'Arial Black', sans-serif;
    font-size: 400px; line-height: 1;
    color: transparent;
    -webkit-text-stroke: 3px rgba(20, 20, 20, 0.16);
    transform: rotate(-6deg);
    user-select: none;
  }
  @supports not (-webkit-text-stroke: 1px black) {
    .cp-ghost { color: rgba(20, 20, 20, 0.14); }
  }
  .cp-col {
    position: absolute; left: 130px; top: 118px; width: 1240px;
  }
  .cp-shout-wrap { position: relative; transform: rotate(-1.2deg); }
  .cp-shout-wrap::before {
    content: ""; position: absolute; inset: -14px -28px -22px -28px;
    background: #1B9AAA; transform: rotate(1.2deg);
  }
  .cp-shout {
    position: relative;
    font-family: 'Archivo Black', 'Arial Black', sans-serif;
    font-size: 92px; line-height: 1.04; font-weight: 400;
    color: #141414; margin: 0; max-width: 1220px;
  }
  .cp-shout::first-line { color: #D7263D; background: #F4F1EA; }
  .cp-swash {
    width: 60%; height: 14px; background: #D7263D;
    transform: rotate(-1deg); margin-top: 34px;
  }
  .cp-scrap-wrap { position: relative; margin-top: 44px; transform: rotate(1.6deg); width: 880px; }
  .cp-scrap-wrap::before {
    content: ""; position: absolute; inset: 0;
    background: #D7263D; transform: rotate(-1deg) translate(14px, 14px);
  }
  .cp-scrap {
    position: relative; background: #FFFFFF;
    border: 2px solid #141414; padding: 26px 34px;
    font-family: 'Libre Franklin', system-ui, sans-serif;
    font-size: 30px; font-weight: 500; line-height: 1.45;
    color: #141414; margin: 0; max-width: 880px; box-sizing: border-box;
  }
  .cp-tape {
    position: absolute; width: 120px; height: 34px;
    background: rgba(244, 211, 94, 0.6);
    box-shadow: 2px 3px 6px rgba(20, 20, 20, 0.18);
    z-index: 2;
  }
  .cp-tape.tl { top: -17px; left: 40px; transform: rotate(-35deg); }
  .cp-tape.tr { top: -17px; right: 40px; transform: rotate(35deg); }
  .cp-tape.tc { top: -17px; left: 50%; margin-left: -60px; transform: rotate(-4deg); }
  .cp-sticky {
    position: absolute; right: 200px; bottom: 96px; width: 560px;
    background: #F4D35E; padding: 30px 34px 34px;
    transform: rotate(-2.5deg); box-sizing: border-box;
    box-shadow: 8px 8px 0 #141414;
  }
  .cp-sticky p {
    font-family: 'Caveat', cursive; font-size: 34px; font-weight: 600;
    line-height: 1.25; color: #141414; margin: 0; text-align: center;
  }
  .cp-badge {
    position: absolute; right: 250px; top: 96px;
    width: 180px; height: 180px; border-radius: 50%;
    background: #D7263D; border: 3px solid #141414;
    box-shadow: 8px 8px 0 #141414;
    transform: rotate(8deg);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Archivo Black', 'Arial Black', sans-serif;
    font-size: 76px; color: #FFFFFF;
  }
  .cp-plus {
    position: absolute;
    font-family: 'Libre Franklin', system-ui, sans-serif;
    font-size: 40px; font-weight: 500; line-height: 1;
    user-select: none;
  }
</style>
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <section class="cp-slide">
      <div class="cp-ghost" aria-hidden="true">SHIP</div>
      <span class="cp-plus" style="left:70px;top:420px;color:#1B9AAA;transform:rotate(12deg);" aria-hidden="true">+</span>
      <span class="cp-plus" style="left:1300px;top:640px;color:#D7263D;transform:rotate(-10deg);" aria-hidden="true">+</span>
      <span class="cp-plus" style="left:1480px;top:640px;color:#1B9AAA;transform:rotate(20deg);" aria-hidden="true">+</span>
      <span class="cp-plus" style="left:90px;top:880px;color:#D7263D;transform:rotate(-16deg);" aria-hidden="true">+</span>
      <span class="cp-plus" style="left:1830px;top:560px;color:#D7263D;transform:rotate(8deg);" aria-hidden="true">+</span>
      <div class="cp-badge" aria-label="11">11</div>
      <div class="cp-col">
        <div class="cp-shout-wrap">
          <h1 class="cp-shout">The Hidden Cost of Rushing to Ship</h1>
        </div>
        <div class="cp-swash" aria-hidden="true"></div>
        <div class="cp-scrap-wrap">
          <span class="cp-tape tl" aria-hidden="true"></span>
          <span class="cp-tape tr" aria-hidden="true"></span>
          <p class="cp-scrap">What 11 postmortems taught us about review discipline</p>
        </div>
      </div>
      <div class="cp-sticky">
        <span class="cp-tape tc" aria-hidden="true"></span>
        <p>Typodeck Research · November 2026</p>
      </div>
    </section>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
