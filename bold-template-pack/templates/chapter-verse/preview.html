<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter &amp; Verse — Title Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
  .cv-slide {
    position: absolute; inset: 0;
    background: #FBF7EF;
    display: flex; flex-direction: column;
    padding: 64px 120px 52px;
    box-sizing: border-box;
    color: #1C1A17;
  }
  .cv-running {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px; font-weight: 500;
    letter-spacing: 0.24em; text-transform: uppercase;
    color: #6B6257;
  }
  .cv-running-rule { height: 1px; background: #B9A88F; margin-top: 18px; }
  .cv-main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; min-height: 0;
  }
  .cv-kicker {
    display: flex; align-items: center; gap: 24px;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 16px; font-weight: 500;
    letter-spacing: 0.34em; text-transform: uppercase;
    color: #7A2E2E; white-space: nowrap;
  }
  .cv-kicker::before, .cv-kicker::after {
    content: ""; display: block; width: 120px; height: 1px; background: #7A2E2E;
  }
  .cv-title {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 100px; font-weight: 600; line-height: 1.06;
    color: #1C1A17; margin: 36px 0 0;
    max-width: 1320px; text-wrap: balance;
  }
  .cv-ornament {
    display: flex; align-items: center; gap: 18px;
    margin: 40px 0 8px; color: #7A2E2E;
    font-family: 'Newsreader', Georgia, serif; font-size: 14px;
  }
  .cv-ornament::before, .cv-ornament::after {
    content: ""; display: block; width: 200px; height: 1px; background: #B9A88F;
  }
  .cv-lede {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 31px; font-weight: 400; line-height: 1.7;
    color: rgba(28, 26, 23, 0.82);
    max-width: 780px; text-align: left; margin: 8px 0 0;
  }
  .cv-lede::first-letter {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 600; font-size: 3.1em; line-height: 0.8;
    float: left; padding: 8px 14px 0 0; color: #7A2E2E;
  }
  .cv-folio-rule { height: 1px; background: #B9A88F; }
  .cv-folio {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-top: 20px;
  }
  .cv-folio-source {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 16px; font-weight: 500; letter-spacing: 0.06em;
    color: #1C1A17;
  }
  .cv-folio-mark {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 18px; color: #7A2E2E;
  }
  .cv-folio-page {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 20px; font-weight: 600; color: #7A2E2E;
  }
</style>
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <section class="cv-slide">
      <header>
        <div class="cv-running"><span>Typodeck Research</span><span>November 2026</span></div>
        <div class="cv-running-rule"></div>
      </header>
      <div class="cv-main">
        <div class="cv-kicker">Chapter One</div>
        <h1 class="cv-title">The Hidden Cost of Rushing to Ship</h1>
        <div class="cv-ornament" aria-hidden="true">◆</div>
        <p class="cv-lede">What 11 postmortems taught us about review discipline</p>
      </div>
      <footer>
        <div class="cv-folio-rule"></div>
        <div class="cv-folio">
          <span class="cv-folio-source">Typodeck Research · November 2026</span>
          <span class="cv-folio-mark" aria-hidden="true">❦</span>
          <span class="cv-folio-page">1</span>
        </div>
      </footer>
    </section>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
