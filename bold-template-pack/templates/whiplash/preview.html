<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiplash — Title Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=EB+Garamond:ital,wght@0,400;1,400&family=Noto+Sans+KR:wght@500&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <div class="wh-slide">
      <div class="wh-arch" aria-hidden="true"></div>
      <div class="wh-echo" aria-hidden="true"></div>
      <div class="wh-tendril wh-tendril-l" aria-hidden="true"></div>
      <div class="wh-tendril wh-tendril-r" aria-hidden="true"></div>
      <div class="wh-content">
        <h1 class="wh-title">The Hidden Cost of Rushing to Ship</h1>
        <div class="wh-divider" aria-hidden="true"><span class="wh-line"></span><span class="wh-fleuron">❦</span><span class="wh-line"></span></div>
        <p class="wh-subtitle">What 11 postmortems taught us about review discipline</p>
        <p class="wh-context">Typodeck Research · November 2026</p>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
<style>
  .wh-slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    background: #F3EDE0;
    overflow: hidden;
  }
  .wh-arch {
    position: absolute;
    left: 340px;
    top: 90px;
    width: 1236px;
    height: 896px;
    border: 2px solid #8C6A3C;
    border-radius: 440px 440px 0 0;
  }
  .wh-echo {
    position: absolute;
    left: 360px;
    top: 110px;
    width: 1198px;
    height: 858px;
    border: 1px solid #B76E79;
    border-radius: 422px 422px 0 0;
  }
  .wh-tendril {
    position: absolute;
    top: 908px;
    width: 64px;
    height: 64px;
    border: 1px solid #8C6A3C;
  }
  .wh-tendril-l { left: 372px; border-right: none; border-bottom: none; border-radius: 64px 0 0 0; }
  .wh-tendril-r { right: 372px; border-left: none; border-bottom: none; border-radius: 0 64px 0 0; }
  .wh-content {
    position: absolute;
    left: 490px;
    top: 225px;
    width: 940px;
    text-align: center;
  }
  .wh-title {
    margin: 0;
    font-family: "Marcellus", "Noto Serif KR", Didot, "Bodoni MT", serif;
    font-weight: 400;
    font-size: 84px;
    line-height: 1.18;
    letter-spacing: 0.01em;
    color: #2F3E33;
    text-wrap: balance;
  }
  .wh-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    margin: 32px 0 0 0;
  }
  .wh-line {
    display: inline-block;
    width: 120px;
    height: 1px;
    background: #8C6A3C;
  }
  .wh-fleuron {
    font-family: "EB Garamond", Garamond, serif;
    font-size: 36px;
    line-height: 1;
    color: #8C6A3C;
  }
  .wh-subtitle {
    margin: 28px 0 0 0;
    font-family: "EB Garamond", "Noto Serif KR", Garamond, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 32px;
    line-height: 1.6;
    color: #2F3E33;
  }
  .wh-subtitle::first-letter {
    font-family: "Marcellus", "Noto Serif KR", Didot, serif;
    font-style: normal;
    font-size: 96px;
    line-height: 0.85;
    color: #2F3E33;
    padding-right: 2px;
  }
  .wh-subtitle:lang(ko)::first-letter,
  .wh-subtitle:lang(zh)::first-letter,
  .wh-subtitle:lang(ja)::first-letter {
    font-family: inherit;
    font-style: inherit;
    font-size: inherit;
    line-height: inherit;
    padding-right: 0;
  }
  .wh-context {
    margin: 36px 0 0 0;
    font-family: "Marcellus", "Noto Sans KR", Didot, serif;
    font-weight: 400;
    font-size: 16px;
    line-height: 1.6;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #2F3E33;
  }
</style>
</body>
</html>
