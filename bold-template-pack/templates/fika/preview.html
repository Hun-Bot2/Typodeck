<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typodeck Preview — Cover Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  .fika-slide {
    position: absolute; inset: 0;
    background: #FAFAF7;
    color: #3D4A54;
    font-family: 'Nunito Sans', system-ui, sans-serif;
    padding: 96px 120px 88px 120px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .fika-kicker {
    display: flex; align-items: center; gap: 18px;
    font-size: 22px; font-weight: 700;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: #3D4A54;
  }
  .fika-dot { width: 14px; height: 14px; border-radius: 999px; background: #7FA6C9; flex: 0 0 auto; }
  .fika-cols {
    flex: 1;
    display: flex; gap: 96px; align-items: center;
    margin-top: 56px;
  }
  .fika-text { flex: 0 0 57%; min-width: 0; }
  .fika-title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 80px;
    line-height: 1.12;
    text-transform: lowercase;
    margin: 0;
    color: #3D4A54;
  }
  .fika-rule { height: 2px; border-radius: 2px; background: #DCE8E3; margin: 40px 0 32px 0; max-width: 560px; }
  .fika-sub {
    font-size: 30px; line-height: 1.6; font-weight: 400;
    margin: 0; max-width: 30ch;
  }
  .fika-chips { display: flex; gap: 20px; margin-top: 40px; flex-wrap: wrap; }
  .fika-chip {
    font-size: 22px; font-weight: 700; letter-spacing: 0.04em;
    color: #3D4A54; border-radius: 999px; padding: 14px 28px;
  }
  .fika-chip.c1 { background: #A8C3B9; }
  .fika-chip.c2 { background: #E8B4A0; }
  .fika-chip.c3 { background: #7FA6C9; }
  .fika-panel {
    flex: 1;
    background: #DCE8E3;
    border-radius: 24px;
    padding: 72px 56px;
    box-sizing: border-box;
    display: flex; flex-direction: column;
    align-items: flex-start; justify-content: center;
    align-self: stretch;
    box-shadow: 0 8px 24px rgba(61, 74, 84, 0.08);
  }
  .fika-numeral {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500; font-size: 200px; line-height: 1;
    color: #3D4A54; margin: 0;
  }
  .fika-panel-cap { font-size: 24px; line-height: 1.6; margin: 24px 0 0 0; max-width: 16ch; }
  .fika-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 48px;
  }
  .fika-page { font-size: 20px; font-weight: 700; letter-spacing: 0.2em; }
  .fika-context { font-size: 20px; font-weight: 400; opacity: 0.72; }
</style>
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <div class="fika-slide">
      <div class="fika-kicker"><span class="fika-dot"></span><span>Typodeck Research · November 2026</span></div>
      <div class="fika-cols">
        <div class="fika-text">
          <h1 class="fika-title">The Hidden Cost of Rushing to Ship</h1>
          <div class="fika-rule"></div>
          <p class="fika-sub">What 11 postmortems taught us about review discipline</p>
          <div class="fika-chips">
            <span class="fika-chip c1">rushing to ship</span>
            <span class="fika-chip c2">11 postmortems</span>
            <span class="fika-chip c3">review discipline</span>
          </div>
        </div>
        <div class="fika-panel">
          <p class="fika-numeral">11</p>
          <p class="fika-panel-cap">postmortems</p>
        </div>
      </div>
      <div class="fika-foot">
        <span class="fika-page">01</span>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
