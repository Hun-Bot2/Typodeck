<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modulo Cover — Typodeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  .modulo-slide {
    position: absolute; inset: 0;
    background-color: #FFFFFF;
    background-image:
      linear-gradient(#E5E5E5 1px, transparent 1px),
      linear-gradient(90deg, #E5E5E5 1px, transparent 1px);
    background-size: 240px 240px;
    font-family: 'Inter', system-ui, sans-serif;
    color: #14213D;
  }
  .modulo-top { position: absolute; top: 64px; left: 120px; right: 120px; display: flex; align-items: center; gap: 16px; }
  .modulo-tile { width: 48px; height: 48px; flex: 0 0 auto; }
  .modulo-kicker { display: flex; align-items: center; gap: 12px; margin-left: 32px; }
  .modulo-chip { width: 12px; height: 12px; background: #FCA311; flex: 0 0 auto; }
  .modulo-kicker-text {
    font-family: 'Sora', "Arial Black", sans-serif; font-weight: 600; font-size: 15px;
    letter-spacing: 0.12em; text-transform: uppercase; color: #14213D; white-space: nowrap;
  }
  .modulo-main { position: absolute; top: 232px; left: 120px; right: 120px; bottom: 200px; display: flex; gap: 64px; }
  .modulo-left { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .modulo-title {
    font-family: 'Sora', "Arial Black", sans-serif; font-weight: 800;
    font-size: 88px; line-height: 1.06; letter-spacing: -0.015em;
    color: #14213D; margin: 0; text-wrap: pretty;
    max-width: 1010px;
  }
  .modulo-title .u-amber { box-shadow: 0 6px 0 0 #FCA311; }
  .modulo-subrow { display: flex; align-items: flex-start; gap: 16px; margin-top: 40px; max-width: 980px; }
  .modulo-sq { width: 14px; height: 14px; background: #FCA311; flex: 0 0 auto; margin-top: 10px; }
  .modulo-subtitle { font-size: 27px; line-height: 1.55; color: #3D4C6D; margin: 0; }
  .modulo-right { flex: 0 0 516px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 16px; align-content: center; }
  .modulo-cell { padding: 28px; display: flex; flex-direction: column; justify-content: center; gap: 10px; min-height: 200px; }
  .modulo-cell.amber { background: #FCA311; color: #14213D; }
  .modulo-cell.deep { background: #14213D; color: #FFFFFF; }
  .modulo-cell.silver { background: #E5E5E5; color: #14213D; }
  .modulo-cell.line { background: #FFFFFF; border: 1px solid #C9C9C9; color: #14213D; }
  .modulo-stat {
    font-family: 'Sora', "Arial Black", sans-serif; font-weight: 800;
    font-size: 84px; line-height: 1; letter-spacing: -0.02em;
  }
  .modulo-cell-label {
    font-family: 'Sora', "Arial Black", sans-serif; font-weight: 600; font-size: 14px;
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  .modulo-point { display: flex; align-items: center; gap: 12px; font-family: 'Sora', "Arial Black", sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; }
  .modulo-dot { width: 12px; height: 12px; border-radius: 50%; background: #FCA311; flex: 0 0 auto; }
  .modulo-cell.deep .modulo-dot.follow { background: #FFFFFF; }
  .modulo-cell.silver .modulo-dot { background: #14213D; border-radius: 0; width: 14px; height: 14px; }
  .modulo-mini { display: flex; gap: 8px; }
  .modulo-mini span { width: 24px; height: 24px; display: block; }
  .modulo-footer { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: #14213D; color: #FFFFFF; }
  .modulo-rule { position: absolute; top: -6px; left: 0; right: 0; height: 6px; background: #FCA311; }
  .modulo-footer-inner {
    height: 120px; padding: 0 120px; display: flex; align-items: center; justify-content: space-between;
    font-family: 'Sora', "Arial Black", sans-serif; font-weight: 600; font-size: 14px;
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  .modulo-counter { color: #FCA311; }
</style>
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <div class="modulo-slide">
      <div class="modulo-top">
        <span class="modulo-tile" style="background:#FCA311"></span>
        <span class="modulo-tile" style="background:#14213D"></span>
        <span class="modulo-tile" style="background:#E5E5E5"></span>
        <span class="modulo-tile" style="background:#14213D"></span>
        <span class="modulo-tile" style="background:#FCA311"></span>
        <span class="modulo-tile" style="background:#E5E5E5"></span>
        <div class="modulo-kicker">
          <span class="modulo-chip"></span>
          <span class="modulo-kicker-text">Typodeck Research · November 2026</span>
        </div>
      </div>
      <div class="modulo-main">
        <div class="modulo-left">
          <h1 class="modulo-title">The Hidden Cost of Rushing to Ship</h1>
          <div class="modulo-subrow">
            <span class="modulo-sq"></span>
            <p class="modulo-subtitle">What 11 postmortems taught us about review discipline</p>
          </div>
        </div>
        <div class="modulo-right">
          <div class="modulo-cell amber">
            <div class="modulo-stat">11</div>
            <div class="modulo-cell-label">Postmortems</div>
          </div>
          <div class="modulo-cell deep">
            <div class="modulo-point"><span class="modulo-dot"></span>Case</div>
            <div class="modulo-point"><span class="modulo-dot follow"></span>Files</div>
          </div>
          <div class="modulo-cell silver">
            <div class="modulo-point"><span class="modulo-dot"></span>Issue</div>
            <div class="modulo-point"><span class="modulo-dot"></span>Nº 01</div>
          </div>
          <div class="modulo-cell line">
            <div class="modulo-mini"><span style="background:#FCA311"></span><span style="background:#14213D"></span><span style="background:#E5E5E5"></span></div>
            <div class="modulo-cell-label">November 2026</div>
          </div>
        </div>
      </div>
      <div class="modulo-footer">
        <div class="modulo-rule"></div>
        <div class="modulo-footer-inner">
          <span class="modulo-counter">01 / 01</span>
          <span>Typodeck Research</span>
        </div>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
