<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Wave Static — Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,700;0,800;0,900;1,700&family=Newsreader:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #FFFFFF; /* New Wave Static surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <style>
      .nw { position: absolute; inset: 0; background: #fff; color: #000;
        font-family: 'Archivo', 'Arial Black', sans-serif; overflow: hidden; }
      .nw-topbar { position: absolute; top: 0; left: 0; right: 0; height: 76px;
        background: #000; color: #fff; display: flex; align-items: center;
        padding: 0 60px; gap: 26px; font-weight: 700; font-size: 24px; letter-spacing: 0.14em; }
      .nw-topbar .mag { background: #FF00A8; color: #fff; padding: 8px 20px; }
      .nw-topbar .spacer { flex: 1; }
      .nw-topbar .cy { color: #00C2FF; }
      .nw-slash { position: absolute; pointer-events: none; }
      .nw-slash.mag { background: #FF00A8; width: 46px; height: 1150px; top: 76px; left: 1770px;
        transform: rotate(24deg); transform-origin: top center; }
      .nw-slash.cy { background: #00C2FF; width: 26px; height: 1150px; top: 76px; left: 1840px;
        transform: rotate(24deg); transform-origin: top center; }
      .nw-slash.blk { background: #000; width: 12px; height: 1150px; top: 76px; left: 1885px;
        transform: rotate(24deg); transform-origin: top center; }
      .nw-slash.mag2 { background: #FF00A8; width: 20px; height: 700px; bottom: -160px; left: -110px;
        transform: rotate(24deg); }
      .nw-ghost { position: absolute; right: -70px; bottom: 40px; font-weight: 900;
        font-size: 560px; line-height: 1; color: transparent;
        -webkit-text-stroke: 6px #FF00A8; opacity: 0.65; letter-spacing: -0.05em; }
      .nw-kicker-rot { position: absolute; top: 330px; left: 1500px; transform: rotate(45deg);
        transform-origin: left center; background: #000; color: #00C2FF;
        font-weight: 800; font-size: 30px; letter-spacing: 0.22em; padding: 14px 30px;
        white-space: nowrap; }
      .nw-body { position: absolute; top: 76px; left: 0; bottom: 120px; width: 1290px;
        padding: 64px 40px 0 90px; display: flex; flex-direction: column; }
      .nw-kicker { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
      .nw-kicker .rule { width: 90px; height: 10px; background: #FF00A8; }
      .nw-kicker .txt { font-weight: 800; font-size: 28px; letter-spacing: 0.24em; }
      .nw-title { margin: 0; font-weight: 800; font-size: 104px; line-height: 1.02;
        letter-spacing: -0.02em; }
      .nw-title .it { font-family: 'Newsreader', Georgia, serif; font-style: italic;
        font-weight: 500; color: #FF00A8; letter-spacing: 0; }
      .nw-title .cy { color: #00C2FF; }
      .nw-midrule { display: flex; align-items: center; gap: 0; margin: 30px 0 26px 0; }
      .nw-midrule .a { width: 200px; height: 12px; background: #000; }
      .nw-midrule .b { width: 120px; height: 12px; background: #FF00A8;
        transform: skewX(-45deg); margin-left: -18px; }
      .nw-midrule .c { width: 60px; height: 12px; background: #00C2FF;
        transform: skewX(-45deg); margin-left: 6px; }
      .nw-sub { margin: 0; font-size: 34px; line-height: 1.4; font-weight: 700; max-width: 22em; }
      .nw-sub .slash { color: #FF00A8; font-weight: 900; }
      .nw-context { margin-top: 26px; display: inline-flex; align-items: center; gap: 16px;
        background: #000; color: #fff; align-self: flex-start; padding: 16px 30px;
        font-weight: 700; font-size: 24px; letter-spacing: 0.1em; }
      .nw-context .dot { width: 16px; height: 16px; background: #00C2FF; flex: 0 0 16px; }
      .nw-foot { position: absolute; left: 0; right: 0; bottom: 0; height: 120px;
        display: flex; align-items: stretch; }
      .nw-foot .blk { flex: 1; background: #000; color: #fff; display: flex;
        align-items: center; padding: 0 60px; gap: 30px;
        font-weight: 700; font-size: 24px; letter-spacing: 0.18em; }
      .nw-foot .blk .n11 { font-weight: 900; font-size: 44px; color: #FF00A8; letter-spacing: 0; }
      .nw-foot .cyb { width: 340px; background: #00C2FF; display: flex; align-items: center;
        justify-content: center; font-weight: 900; font-size: 30px; letter-spacing: 0.2em; }
    </style>
    <div class="nw">
      <div class="nw-topbar"><span class="mag">TYPODECK</span><span>RESEARCH</span><span class="spacer"></span><span class="cy">NOV 2026</span><span>/ 11 CASES</span></div>
      <div class="nw-slash mag"></div><div class="nw-slash cy"></div><div class="nw-slash blk"></div>
      <div class="nw-slash mag2"></div>
      <div class="nw-ghost" aria-hidden="true">11</div>
      <div class="nw-kicker-rot">READ THE FAILURE LOG ▸</div>
      <div class="nw-body">
        <div class="nw-kicker"><span class="rule"></span><span class="txt">POSTMORTEM SERIES</span></div>
        <h1 class="nw-title" aria-label="The Hidden Cost of Rushing to Ship">The Hidden <span class="it">Cost</span> of Rushing to <span class="cy">Ship</span></h1>
        <div class="nw-midrule"><span class="a"></span><span class="b"></span><span class="c"></span></div>
        <p class="nw-sub"><span class="slash">///</span> What 11 postmortems taught us about review discipline</p>
        <div class="nw-context"><span class="dot"></span><span>Typodeck Research · November 2026</span></div>
      </div>
      <div class="nw-foot">
        <div class="blk"><span class="n11">11</span><span>POSTMORTEMS ─ ONE WARNING</span></div>
        <div class="cyb">P. 01</div>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
