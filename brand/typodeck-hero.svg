<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="title desc">
  <title id="title">Typodeck</title>
  <desc id="desc">Typodeck wordmark. Typography-only pitch decks: real editable PowerPoint text, every number traces to evidence.</desc>
  <rect width="1280" height="480" fill="#FFFFFF"/>
  <!-- kicker -->
  <text x="640" y="120" text-anchor="middle" font-family="Inter,Archivo,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="7" fill="#5C5C5C">TYPOGRAPHY-ONLY PITCH DECKS</text>
  <!-- wordmark -->
  <text x="640" y="288" text-anchor="middle" font-family="Inter,Archivo,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="168" font-weight="700" letter-spacing="-3" fill="#111111">Typodeck<tspan fill="#9A3B26">.</tspan></text>
  <!-- tagline -->
  <text x="640" y="360" text-anchor="middle" font-family="Inter,Archivo,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" fill="#5C5C5C">Real editable PowerPoint text. Every number traces to evidence.</text>
  <!-- proof line -->
  <text x="640" y="416" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="24" letter-spacing="2" fill="#5C5C5C">270/270 TESTS &#183; 24/24 EVAL &#183; 100% EDITABLE</text>
</svg>
