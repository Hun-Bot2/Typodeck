<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Typodeck social preview</title>
  <desc id="desc">Typodeck social preview card: wordmark, tagline, and proof line on dark band.</desc>
  <rect width="1280" height="640" fill="#14120E"/>
  <!-- kicker -->
  <text x="120" y="168" font-family="Inter,Archivo,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="600" letter-spacing="8" fill="#F2EEE4" opacity="0.65">TYPOGRAPHY-ONLY PITCH DECKS</text>
  <!-- wordmark, one-colour bone -->
  <text x="116" y="360" font-family="Inter,Archivo,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="192" font-weight="700" letter-spacing="-4" fill="#F2EEE4">Typodeck.</text>
  <!-- tagline -->
  <text x="120" y="452" font-family="Inter,Archivo,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" fill="#F2EEE4" opacity="0.85">Real editable PowerPoint text. No stock imagery.</text>
  <!-- proof line -->
  <text x="120" y="536" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="28" letter-spacing="2" fill="#F2EEE4" opacity="0.65">EVERY NUMBER TRACES TO EVIDENCE &#183; 100% EDITABLE</text>
</svg>
