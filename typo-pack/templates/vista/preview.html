<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typodeck Preview — Cover Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
  .vista-slide {
    position: absolute; inset: 0;
    background: #FFFDF6;
    color: #0E3B43;
    font-family: 'Outfit', system-ui, sans-serif;
    display: flex; flex-direction: column;
    box-sizing: border-box;
  }
  .vista-sky {
    flex: 0 0 248px;
    background: #0E3B43;
    color: #F6E7C1;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 120px;
    box-sizing: border-box;
    position: relative;
  }
  .vista-kicker { margin: 0; }
  .vista-kicker span {
    font-size: 22px; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
  }
  .vista-keyline { height: 2px; background: #E4572E; margin-top: 14px; width: 420px; }
  .vista-leafchip {
    background: #A8C686; color: #0E3B43;
    font-size: 20px; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 12px 22px;
    align-self: flex-start;
    margin-top: 44px;
  }
  .vista-headband {
    flex: 0 0 auto;
    background: #F6E7C1;
    color: #0E3B43;
    text-align: center;
    padding: 48px 300px 56px 300px;
    box-sizing: border-box;
    position: relative;
  }
  .vista-title {
    font-family: 'DM Serif Display', Georgia, serif;
    font-weight: 400;
    font-size: 76px; line-height: 1.1;
    margin: 0;
    text-wrap: balance;
  }
  .vista-badge {
    position: absolute; right: 120px; top: -98px;
    width: 196px; height: 196px;
  }
  .vista-badge .disc {
    position: absolute; inset: 0;
    background: #E4572E; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 72px; color: #F6E7C1;
  }
  .vista-badge .ring {
    position: absolute; inset: -14px;
    border: 3px dashed #E4572E; border-radius: 999px;
  }
  .vista-ticket {
    flex: 0 0 auto;
    position: relative;
    background: #FFFDF6;
    border-top: 3px dashed #E4572E;
  }
  .vista-notch { position: absolute; top: -28px; width: 56px; height: 56px; border-radius: 999px; background: #0A2D34; }
  .vista-notch.left { left: -28px; }
  .vista-notch.right { right: -28px; }
  .vista-bodyband {
    flex: 1;
    min-height: 0;
    background: #FFFDF6;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 24px 300px;
    box-sizing: border-box;
  }
  .vista-sub {
    font-size: 31px; font-weight: 400; line-height: 1.55;
    margin: 0; max-width: 40ch; color: #0E3B43;
  }
  .vista-ground {
    flex: 0 0 108px;
    background: #0A2D34;
    color: #F6E7C1;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 120px;
    box-sizing: border-box;
  }
  .vista-date {
    font-size: 20px; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
    margin: 0;
  }
  .vista-page {
    font-size: 20px; font-weight: 600; letter-spacing: 0.25em;
    margin: 0;
  }
</style>
<!-- SCAFFOLD-EMBED-START (copy this whole block into preview.html) -->
<style>
  /* Letterbox shell: viewport centers the fixed stage, never reflows it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000; /* letterbox bars */
    overflow: hidden;
  }
  #deck-viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  /* THE stage: exactly 1920x1080. Do not change these dimensions. */
  #deck-stage {
    width: 1920px;
    height: 1080px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    background: #fff; /* each design overrides with its own surface */
  }
</style>
</head>
<body>
<div id="deck-viewport">
  <div id="deck-stage">
    <!-- DESIGN SLIDE MARKUP GOES HERE (replaces this placeholder) -->
    <div class="vista-slide">
      <div class="vista-sky">
        <p class="vista-kicker"><span>Typodeck Research · November 2026</span><span class="vista-keyline" style="display:block"></span></p>
        <span class="vista-leafchip">review discipline</span>
      </div>
      <div class="vista-headband">
        <div class="vista-badge"><div class="ring"></div><div class="disc">11</div></div>
        <h1 class="vista-title">The Hidden Cost of Rushing to Ship</h1>
      </div>
      <div class="vista-ticket">
        <span class="vista-notch left"></span>
        <span class="vista-notch right"></span>
      </div>
      <div class="vista-bodyband">
        <p class="vista-sub">What 11 postmortems taught us about review discipline</p>
      </div>
      <div class="vista-ground">
        <p class="vista-date">November 2026</p>
        <p class="vista-page">01</p>
      </div>
    </div>
    <!-- /DESIGN SLIDE MARKUP -->
  </div>
</div>
<script>
  /* Uniform stage scaler: one transform, aspect preserved, no reflow. */
  function __typodeckFitStage() {
    var stage = document.getElementById('deck-stage');
    if (!stage) return;
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', __typodeckFitStage);
  window.addEventListener('orientationchange', __typodeckFitStage);
  document.addEventListener('DOMContentLoaded', __typodeckFitStage);
  __typodeckFitStage();
</script>
<!-- SCAFFOLD-EMBED-END -->
</body>
</html>
