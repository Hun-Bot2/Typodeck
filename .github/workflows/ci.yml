name: CI

# Test + type-check + production build. No deploy job: publishing is a manual,
# reviewed step (see docs/DEPLOYMENT.md) until the public-deploy blockers there
# are cleared.
on:
  push:
    branches: [main, 'agent/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test @typodeck/core (builds, then runs node --test)
        run: npm test

      - name: Type-check @typodeck/web
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: Production build @typodeck/web
        run: npm run build -w @typodeck/web
